    return `<div class="evo">${ramo(evo.chain, null)}</div>`;
  }
  function fraquezas(tipos) {
    const res = [];
    TIPOS.forEach(atk => {
      let m = 1;
      tipos.forEach(td => {
        if (!td) return;
        const r = td.rel;
        if ((r.double_damage_from || []).some(x => x.name === atk)) m *= 2;
        if ((r.half_damage_from || []).some(x => x.name === atk)) m *= 0.5;
        if ((r.no_damage_from || []).some(x => x.name === atk)) m *= 0;
      });
      if (m > 1) res.push([atk, m]);
    });
    return res.sort((a, b) => b[1] - a[1]);
  }
  const chipTipo = (nome, extra) => `<span class="tipo" style="background:${COR_TIPO[nome] || "#999"};color:${TINTA_TIPO[nome] || "#111"}">${esc(t("tipos")[nome] || textoBonito(nome))}${extra ? ` <b>${extra}</b>` : ""}</span>`;

  async function desenharFicha() {
    const id = xState.ids[xState.i];
    const base = DEX.find(p => p.id === id) || { id, n: "#" + id };
    const pedido = ++xState.pedido;
    $("xNome").textContent = base.n;
    $("xNum").textContent = "#" + pad4(id);
    $("xPos").textContent = t("zPos", xState.i + 1, xState.ids.length);
    $("xPrevP").disabled = xState.i === 0;
    $("xNextP").disabled = xState.i >= xState.ids.length - 1;
    $("xArt").innerHTML = `<img src="${xState.shiny ? ARTE_SHINY(id) : ARTE(id)}" alt="${esc(base.n)}${xState.shiny ? " (" + esc(t("shiny")) + ")" : ""}" width="300" height="300">`;
    $("xShiny").setAttribute("aria-pressed", String(xState.shiny));
    $("xShiny").textContent = xState.shiny ? t("normalArt") : t("shiny");
    $("xCorpo").innerHTML = `<p class="ficha-carregando"><span class="spin" aria-hidden="true"></span>${esc(t("detailLoading"))}</p>`;
    $("xTopo").style.setProperty("--tc", "#E9DDE3");
    let d;
    try { d = await carregarDetalhe(id); }
    catch (e) {
      if (pedido !== xState.pedido) return;
      console.error(e);
      $("xCorpo").innerHTML = `<p class="ficha-nota">${esc(t("detailErr"))}</p><button type="button" class="btn-retry" data-ficha-retry="1">${esc(t("retry"))}</button>`;
      return;
    }
    if (pedido !== xState.pedido) return;
    const { pk, sp, evo, tipos, habs } = d;
    const nomeEn = (emIngles(sp.names)[0] || {}).name || base.n;
    const nomeJa = ((sp.names || []).find(x => x.language.name === "ja") || {}).name || "";
    const genus = (emIngles(sp.genera)[0] || {}).genus || "";
    const flavor = (emIngles(sp.flavor_text_entries).slice(-1)[0] || {}).flavor_text || "";
    const tiposPk = (pk.types || []).sort((a, b) => a.slot - b.slot).map(x => x.type.name);
    $("xNome").textContent = nomeEn;
    $("xTopo").style.setProperty("--tc", COR_TIPO[tiposPk[0]] || "#E9DDE3");
    const m = pk.height / 10, kg = pk.weight / 10;
    const pol = Math.round(m * 39.3701), pes = Math.floor(pol / 12), polR = pol % 12;
    const lb = (kg * 2.20462).toFixed(1);
    const tags = [];
    if (sp.is_legendary) tags.push(t("legendary"));
    if (sp.is_mythical) tags.push(t("mythical"));
    if (sp.is_baby) tags.push(t("baby"));
    const habsHTML = (pk.abilities || []).sort((a, b) => a.slot - b.slot).map((a, i) => {
      const info = habs[i];
      const nome = info ? ((emIngles(info.names)[0] || {}).name || textoBonito(a.ability.name)) : textoBonito(a.ability.name);
      const desc = info ? ((emIngles(info.effect_entries)[0] || {}).short_effect || (emIngles(info.flavor_text_entries).slice(-1)[0] || {}).flavor_text || "") : "";
      return `<li><strong>${esc(nome)}</strong>${a.is_hidden ? ` <span class="hab-oculta">${esc(t("hiddenAb"))}</span>` : ""}${desc ? `<span>${esc(desc.replace(/\s+/g, " "))}</span>` : ""}</li>`;
    }).join("");
    const nomesStat = t("statNames");
    const totalStats = (pk.stats || []).reduce((a, s) => a + s.base_stat, 0);
    const statsHTML = (pk.stats || []).map(s => {
      const v = s.base_stat;
      const cor = v >= 120 ? "#2E9E6A" : v >= 90 ? "#7BBF3B" : v >= 60 ? "#E8B923" : "#E0703A";
      return `<div class="stat"><span class="stat-nm">${esc(nomesStat[s.stat.name] || textoBonito(s.stat.name))}</span><span class="stat-v">${v}</span><span class="stat-bar"><i style="width:${Math.min(100, v / 255 * 100)}%;background:${cor}"></i></span></div>`;
    }).join("") + `<div class="stat total"><span class="stat-nm">${esc(t("total"))}</span><span class="stat-v">${totalStats}</span><span></span></div>`;
    const fr = fraquezas(tipos);
    const genero = sp.gender_rate < 0 ? t("genderless") : `♂ ${((8 - sp.gender_rate) / 8 * 100).toFixed(1).replace(".0", "")}% · ♀ ${(sp.gender_rate / 8 * 100).toFixed(1).replace(".0", "")}%`;
    const formas = (sp.varieties || []).filter(v => !v.is_default).map(v => textoBonito(v.pokemon.name.replace(sp.name + "-", "")));
    const geracao = sp.generation ? t("dexGenN", ROMANOS[idDaUrl(sp.generation.url) - 1] || "?") : "—";
    const grito = pk.cries && (pk.cries.latest || pk.cries.legacy);
    $("xCorpo").innerHTML = `
      <p class="ficha-genus">${esc(genus)}${nomeJa ? ` <span lang="ja">· ${esc(nomeJa)}</span>` : ""}</p>
      <div class="ficha-tipos">${tiposPk.map(x => chipTipo(x)).join("")}${tags.map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>
      ${flavor ? `<p class="ficha-flavor">${esc(flavor.replace(/[\f\n\r]+/g, " "))}</p>` : ""}
      <dl class="ficha-medidas">
        <div><dt>${esc(t("height"))}</dt><dd>${m.toLocaleString(undefined, { maximumFractionDigits: 1 })} m <small>(${pes}′${String(polR).padStart(2, "0")}″)</small></dd></div>
        <div><dt>${esc(t("weight"))}</dt><dd>${kg.toLocaleString(undefined, { maximumFractionDigits: 1 })} kg <small>(${lb} lb)</small></dd></div>
        <div><dt>${esc(t("generation"))}</dt><dd>${esc(geracao)}</dd></div>
        <div><dt>${esc(t("habitat"))}</dt><dd>${esc(sp.habitat ? textoBonito(sp.habitat.name) : "—")}</dd></div>
      </dl>
      <div class="ficha-acoes">
        ${grito ? `<button type="button" class="pill" data-grito="${esc(grito)}">▶ ${esc(t("cry"))}</button>` : ""}
        <button type="button" class="pill" data-ver-cartas="${esc(nomeEn)}">${esc(t("seeCards"))}</button>
      </div>
      <h3>${esc(t("abilities"))}</h3>
      <ul class="ficha-habs">${habsHTML}</ul>
      <h3>${esc(t("baseStats"))}</h3>
      <div class="ficha-stats">${statsHTML}</div>
      ${fr.length ? `<h3>${esc(t("weakTo"))}</h3><div class="ficha-tipos">${fr.map(([x, mult]) => chipTipo(x, "×" + mult)).join("")}</div>` : ""}
      <h3>${esc(t("evolution"))}</h3>
      ${evoHTML(evo, id) || `<p class="ficha-nota">${esc(t("evoNone"))}</p>`}
      <h3>${esc(t("breeding"))}</h3>
      <dl class="ficha-medidas">
        <div><dt>${esc(t("gender"))}</dt><dd>${esc(genero)}</dd></div>
        <div><dt>${esc(t("eggGroups"))}</dt><dd>${esc((sp.egg_groups || []).map(x => textoBonito(x.name)).join(", ") || "—")}</dd></div>
        <div><dt>${esc(t("catchRate"))}</dt><dd>${sp.capture_rate}</dd></div>
        <div><dt>${esc(t("happiness"))}</dt><dd>${sp.base_happiness ?? "—"}</dd></div>
        <div><dt>${esc(t("growth"))}</dt><dd>${esc(sp.growth_rate ? textoBonito(sp.growth_rate.name) : "—")}</dd></div>
        <div><dt>${esc(t("baseExp"))}</dt><dd>${pk.base_experience ?? "—"}</dd></div>
      </dl>
      ${formas.length ? `<h3>${esc(t("forms"))}</h3><div class="ficha-tipos">${formas.map(f => `<span class="tag">${esc(f)}</span>`).join("")}</div>` : ""}`;
  }
  function abrirFicha(id, ids) {
    xState.ids = ids && ids.length ? ids : [id];
    xState.i = Math.max(0, xState.ids.indexOf(id));
    xState.origem = id;
    xState.shiny = false;
    dexModal.hidden = false;
    wrap.inert = true;
    $("xFechar").focus();
    $("xCaixa").scrollTop = 0;
    desenharFicha();
  }
  function fecharFicha() {
    if (dexModal.hidden) return;
    dexModal.hidden = true;
    wrap.inert = false;
    const atual = xState.ids[xState.i];
    const pos = dexState.lista.findIndex(p => p.id === atual);
    const pp = dexPorPagina();
    if (conta.cfg.area === "dex" && pos >= 0 && Math.floor(pos / pp) !== dexState.page) { dexState.page = Math.floor(pos / pp); renderDex(); }
    const alvo = xGrid.querySelector(`[data-dex="${atual}"]`) || xGrid.querySelector(`[data-dex="${xState.origem}"]`) || sideTab;
    alvo.focus();
  }
  function irFicha(d) {
    const n = xState.i + d;
    if (n < 0 || n >= xState.ids.length) return;
    xState.i = n; xState.shiny = false;
    $("xCaixa").scrollTop = 0;
    desenharFicha();
  }
  xGrid.addEventListener("click", e => {
    const b = e.target.closest("[data-dex]");
    if (b) abrirFicha(Number(b.dataset.dex), dexState.lista.map(p => p.id));
  });
  $("xFechar").addEventListener("click", fecharFicha);
  $("xPrevP").addEventListener("click", () => irFicha(-1));
  $("xNextP").addEventListener("click", () => irFicha(1));
  $("xShiny").addEventListener("click", () => {
    xState.shiny = !xState.shiny;
    const id = xState.ids[xState.i];
    const nome = $("xNome").textContent;
    $("xArt").innerHTML = `<img src="${xState.shiny ? ARTE_SHINY(id) : ARTE(id)}" alt="${esc(nome)}${xState.shiny ? " (" + esc(t("shiny")) + ")" : ""}" width="300" height="300">`;
    $("xShiny").setAttribute("aria-pressed", String(xState.shiny));
    $("xShiny").textContent = xState.shiny ? t("normalArt") : t("shiny");
  });
  dexModal.addEventListener("click", e => {
    if (e.target === dexModal) { fecharFicha(); return; }
    const evo = e.target.closest("[data-evo]");
    if (evo) {
      const id = Number(evo.dataset.evo);
      if (id === xState.ids[xState.i]) return;
      const i = xState.ids.indexOf(id);
      if (i >= 0) xState.i = i; else { xState.ids = [id]; xState.i = 0; }
      xState.shiny = false; $("xCaixa").scrollTop = 0; desenharFicha(); $("xFechar").focus();
      return;
    }
    const gr = e.target.closest("[data-grito]");
    if (gr) { try { const a = new Audio(gr.dataset.grito); a.volume = 0.5; a.play().catch(() => {}); } catch (err) { /* sem som */ } return; }
    const vc = e.target.closest("[data-ver-cartas]");
    if (vc) {
      dexModal.hidden = true; wrap.inert = false;
      conta.cfg.area = "binder"; salvarConta(); aplicarArea();
      state.q = vc.dataset.verCartas; state.tab = "todas"; state.posse = ""; state.serie = ""; state.set = ""; state.page = 0;
      $("busca").value = state.q; preencherFiltros(); render();
      $("busca").focus();
      return;
    }
    if (e.target.closest("[data-ficha-retry]")) desenharFicha();
  });
  document.addEventListener("keydown", e => {
    if (dexModal.hidden) return;
    if (e.key === "Escape") { e.preventDefault(); fecharFicha(); }
    else if (e.key === "ArrowLeft" && !e.target.closest("input, select")) irFicha(-1);
    else if (e.key === "ArrowRight" && !e.target.closest("input, select")) irFicha(1);
  });

  /* ---------- Painel lateral: cadastro e configurações ---------- */
  const wrap = $("wrap"), painel = $("painel"), scrim = $("scrim"), sideTab = $("sideTab");
  function abrirPainel() {
    painel.classList.add("open"); scrim.hidden = false;
    sideTab.setAttribute("aria-expanded", "true");
    wrap.inert = true; $("fechar").focus();
  }
  function fecharPainel() {
    painel.classList.remove("open"); scrim.hidden = true;
    sideTab.setAttribute("aria-expanded", "false");
    wrap.inert = false; sideTab.focus();
  }
  sideTab.addEventListener("click", abrirPainel);
  $("fechar").addEventListener("click", fecharPainel);
  scrim.addEventListener("click", fecharPainel);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && painel.classList.contains("open")) fecharPainel(); });

  const contaBox = $("contaBox");
  function renderConta() {
    if (conta.perfil) {
      const p = conta.perfil;
      contaBox.innerHTML = `
        <div class="conta-ok" id="contaOk" tabindex="-1">
          <span class="avatar" aria-hidden="true">${esc(p.nome.charAt(0).toUpperCase())}</span>
          <div><p class="nome">${esc(p.nome)}</p><p class="email">${esc(p.email)}</p></div>
        </div>
        <p class="nota">${esc(t("acctDone"))}</p>
        <button type="button" class="btn-sec" id="btnSair">${esc(t("signOut"))}</button>`;
    } else {
      contaBox.innerHTML = `
        <p class="nota" style="margin-top:0">${esc(t("acctIntro"))}</p>
        <div class="field"><label for="inNome">${esc(t("name"))}</label><input id="inNome" type="text" autocomplete="nickname" maxlength="30"></div>
        <div class="field"><label for="inEmail">${esc(t("email"))}</label><input id="inEmail" type="email" inputmode="email" autocomplete="email"></div>
        <p class="erro" id="erro" role="alert"></p>
        <button type="button" class="btn-primary" id="btnCriar">${esc(t("create"))}</button>
        <p class="nota">${esc(t("acctNote"))}</p>`;
    }
  }
  function criarConta() {
    const nome = $("inNome").value.trim();
    const email = $("inEmail").value.trim();
    const erro = $("erro");
    if (nome.length < 2) { erro.textContent = t("errName"); $("inNome").focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { erro.textContent = t("errEmail"); $("inEmail").focus(); return; }
    conta.perfil = { nome, email };
    salvarConta(); renderConta(); $("contaOk").focus();
  }
  contaBox.addEventListener("click", e => {
    if (e.target.closest("#btnCriar")) criarConta();
    if (e.target.closest("#btnSair")) { conta.perfil = null; salvarConta(); renderConta(); $("inNome").focus(); }
  });
  contaBox.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.matches("#inNome, #inEmail")) { e.preventDefault(); criarConta(); }
  });

  function aplicarCfg() {
    document.documentElement.classList.toggle("sem-anim", !conta.cfg.anim);
    $("cfgCinza").setAttribute("aria-checked", String(conta.cfg.cinza));
    $("cfgAnim").setAttribute("aria-checked", String(conta.cfg.anim));
    $("cfgOrdem").value = conta.cfg.ordem;
    document.documentElement.dataset.tema = conta.cfg.tema;
    document.querySelectorAll("#temas [data-tema]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tema === conta.cfg.tema)));
  }
  $("temas").addEventListener("click", e => {
    const b = e.target.closest("[data-tema]");
    if (!b) return;
    conta.cfg.tema = b.dataset.tema;
    salvarConta();
    aplicarCfg();
  });
  $("cfgCinza").addEventListener("click", () => { conta.cfg.cinza = !conta.cfg.cinza; salvarConta(); aplicarCfg(); atualizar(); });
  $("cfgAnim").addEventListener("click", () => { conta.cfg.anim = !conta.cfg.anim; salvarConta(); aplicarCfg(); });
  $("cfgOrdem").addEventListener("change", e => { conta.cfg.ordem = e.target.value; state.page = 0; dState.page = 0; salvarConta(); atualizar(); });

  /* ---------- Idioma (bandeiras) ---------- */
  const FLAGS = (() => {
    let us = '<svg width="30" height="20" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#FFFFFF"/>';
    for (let i = 0; i < 13; i += 2) us += `<rect y="${(i * 20 / 13).toFixed(2)}" width="30" height="${(20 / 13).toFixed(2)}" fill="#B22234"/>`;
    us += '<rect width="13" height="10.77" fill="#3C3B6E"/>';
    for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) us += `<circle cx="${(1.3 + c * 2.4 + (r % 2) * 1.2).toFixed(1)}" cy="${(1.4 + r * 2.4).toFixed(1)}" r="0.55" fill="#FFFFFF"/>`;
    us += '</svg>';
    const br = '<svg width="30" height="20" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#009C3B"/><path d="M15 2.2L27 10 15 17.8 3 10z" fill="#FFDF00"/><circle cx="15" cy="10" r="4.1" fill="#002776"/><path d="M11 9.2c2.6-.7 5.6-.3 8 1.2" stroke="#FFFFFF" stroke-width="0.9" fill="none"/></svg>';
    const jp = '<svg width="30" height="20" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#FFFFFF"/><circle cx="15" cy="10" r="6" fill="#BC002D"/></svg>';
    return { us, br, jp };
  })();
  document.querySelectorAll("[data-flag]").forEach(el => { el.innerHTML = FLAGS[el.dataset.flag]; });

  function preencherFiltros() {
    const sel = (id, html, val) => { const el = $(id); el.innerHTML = html; el.value = val; if (el.value !== val) el.value = ""; };
    sel("fPosse", `<option value="">${esc(t("sit"))}</option><option value="tenho">${esc(t("fOwn"))}</option><option value="faltam">${esc(t("fMissing"))}</option>`, state.posse);
    sel("fSerie", `<option value="">${esc(t("serie"))}</option>` + SERIES.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join(""), state.serie);
    const grupos = state.serie ? SERIES.filter(s => s.id === state.serie) : SERIES;
    const opts = s => s.sets.map(id => `<option value="${esc(id)}">${esc(SETS[id].name)}</option>`).join("");
    sel("fSet", `<option value="">${esc(t("set"))}</option>` + (state.serie
      ? grupos.map(opts).join("")
      : grupos.map(s => `<optgroup label="${esc(s.name)}">${opts(s)}</optgroup>`).join("")), state.set);
    sel("dPosse", `<option value="">${esc(t("sit"))}</option><option value="tenho">${esc(t("fOwn"))}</option><option value="faltam">${esc(t("fMissing"))}</option>`, dState.posse);
    sel("dSerie", `<option value="">${esc(t("serie"))}</option>` + SERIES.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join(""), dState.serie);
    const dGrupos = dState.serie ? SERIES.filter(s => s.id === dState.serie) : SERIES;
    sel("dSet", `<option value="">${esc(t("set"))}</option>` + (dState.serie
      ? dGrupos.map(opts).join("")
      : dGrupos.map(s => `<optgroup label="${esc(s.name)}">${opts(s)}</optgroup>`).join("")), dState.set);
    sel("cfgOrdem", `<option value="num">${esc(t("ordNum"))}</option><option value="nome">${esc(t("ordName"))}</option>`, conta.cfg.ordem);
  }
  function aplicarIdioma() {
    const d = I18N[conta.cfg.lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
    document.querySelectorAll("[data-i18n-ph]").forEach(el => el.setAttribute("placeholder", t(el.dataset.i18nPh)));
    $("langNote").textContent = t("langNote");
    document.querySelectorAll(".lang-btn").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === conta.cfg.lang)));
    document.querySelectorAll("#temas [data-tema]").forEach(b => b.setAttribute("aria-label", t("themes")[b.dataset.tema]));
    reset.textContent = t(armado ? "resetArm" : "reset");
    $("deckDel").textContent = t("deckDel");
    if (dState.form) $("deckFormLbl").textContent = t(dState.form === "new" ? "deckNewLbl" : "deckRenLbl");
    aplicarArea();
    preencherFiltros();
    preencherFiltrosDex();
    const tinhaForm = !conta.perfil && $("inNome") ? [$("inNome").value, $("inEmail").value] : null;
    renderConta();
    if (tinhaForm) { $("inNome").value = tinhaForm[0]; $("inEmail").value = tinhaForm[1]; }
  }
  document.querySelector(".langs").addEventListener("click", e => {
    const b = e.target.closest(".lang-btn");
    if (!b || b.dataset.lang === conta.cfg.lang) return;
    conta.cfg.lang = b.dataset.lang;
    salvarConta();
    aplicarIdioma();
    atualizar();
    if (!zoom.hidden) desenharZoom();
    if (!dexModal.hidden) desenharFicha();
  });

  aplicarIdioma();
  aplicarCfg();
  carregarDados();
})();
</script>
</body>
</html>
