<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokémon Binder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FCE5EF;
    --surface: #FFFFFF;
    --text: #3A1626;
    --muted: #7A3A52;
    --line: #B8607E;
    --seg-bg: #F3BBD0;
    --seg-on-bg: #4A1B30;
    --seg-on-fg: #FFFFFF;
    --focus: #2338C8;
    --own: #D94F86;
    --page: #2A1822;
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .wrap { max-width: 760px; margin: 0 auto; padding: clamp(18px, 4vw, 40px) clamp(14px, 4vw, 24px) 48px 52px; }

  /* Aba vertical na lateral esquerda */
  .side-tab {
    position: fixed; left: env(safe-area-inset-left, 0px); top: 50%; transform: translateY(-50%); z-index: 10;
    display: inline-flex; align-items: center; gap: 10px; padding: 16px 9px;
    writing-mode: vertical-rl; border: 0; border-radius: 0 12px 12px 0;
    background: #4A1B30; color: #FFFFFF; font: 600 14px "Figtree", system-ui, sans-serif; cursor: pointer;
    box-shadow: 2px 4px 14px -4px rgba(58, 22, 38, 0.55);
  }
  .side-tab[aria-expanded="true"] { visibility: hidden; }
  @media (hover: hover) { .side-tab:hover { background: #63284A; } }

  .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(58, 22, 38, 0.45); }
  .painel {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 30; width: min(340px, 88vw);
    overflow-y: auto; overscroll-behavior: contain;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px calc(env(safe-area-inset-bottom, 0px) + 24px);
    background: var(--surface); color: var(--text); box-shadow: 0 0 40px rgba(58, 22, 38, 0.4);
    transform: translateX(-100%); visibility: hidden; transition: transform 0.25s ease, visibility 0s linear 0.25s;
  }
  .painel.open { transform: none; visibility: visible; transition: transform 0.25s ease; }
  .painel-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .painel h2 { margin: 0; font: 800 1.4rem/1.15 "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif; letter-spacing: -0.015em; }
  .painel h3 { margin: 24px 0 8px; font-size: 1rem; font-weight: 700; }
  .fechar { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--text); cursor: pointer; }
  .nota { margin: 10px 0 0; color: var(--muted); font-size: 0.86rem; line-height: 1.45; }
  .field { display: grid; gap: 6px; margin-top: 12px; }
  .field label { font-weight: 600; font-size: 0.9rem; }
  .painel input[type="text"], .painel input[type="email"], .painel select {
    width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
    background: #FFFFFF; color: var(--text); font: 500 16px "Figtree", system-ui, sans-serif;
  }
  .erro { min-height: 1.3em; margin: 8px 0 0; color: #A3112F; font-size: 0.86rem; font-weight: 600; }
  .btn-primary, .btn-sec { width: 100%; height: 44px; margin-top: 6px; border-radius: 12px; font: 700 15px "Figtree", system-ui, sans-serif; cursor: pointer; }
  .btn-primary { border: 0; background: #4A1B30; color: #FFFFFF; }
  .btn-sec { border: 1px solid var(--line); background: transparent; color: var(--text); margin-top: 12px; }
  @media (hover: hover) { .btn-primary:hover { background: #63284A; } .btn-sec:hover, .fechar:hover { background: var(--bg); } }
  .conta-ok { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
  .conta-ok:focus { outline: none; }
  .avatar { flex: none; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; background: var(--seg-bg); color: #4A1B30; font: 800 1.25rem "Bricolage Grotesque", system-ui, sans-serif; }
  .conta-ok p { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .conta-ok .nome { font-weight: 700; }
  .conta-ok .email { color: var(--muted); font-size: 0.88rem; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-top: 1px solid rgba(184, 96, 126, 0.3); }
  .row p { margin: 0; }
  .row-t { font-weight: 600; font-size: 0.93rem; }
  .row-d { color: var(--muted); font-size: 0.82rem; line-height: 1.4; }
  .row.col { display: block; }
  .row.col .field { margin-top: 0; }
  .switch { position: relative; flex: none; width: 56px; height: 32px; padding: 0; border: 1.5px solid #B8607E; border-radius: 99px; background: #FBDFEA; cursor: pointer; transition: background 0.18s ease; }
  .switch .knob { position: absolute; top: 2px; left: 2px; width: 25px; height: 25px; display: block; transition: transform 0.18s ease; filter: drop-shadow(0 1px 2px rgba(90, 30, 55, 0.45)); }
  .switch .knob svg { display: block; width: 100%; height: 100%; }
  .switch[aria-checked="true"] { background: #F6A3C0; }
  .switch[aria-checked="true"] .knob { transform: translateX(24px); }
  .langs { display: grid; gap: 8px; margin-top: 8px; }
  .lang-btn { display: flex; align-items: center; gap: 12px; width: 100%; height: 46px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: #FFFFFF; color: var(--text); font: 600 15px "Figtree", system-ui, sans-serif; text-align: left; cursor: pointer; }
  .lang-btn[aria-pressed="true"] { background: var(--seg-on-bg); border-color: var(--seg-on-bg); color: #FFFFFF; }
  .lang-btn .flag { flex: none; display: block; width: 30px; height: 20px; }
  .lang-btn .flag svg { display: block; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25); }
  .lang-btn .tick { margin-left: auto; opacity: 0; }
  .lang-btn[aria-pressed="true"] .tick { opacity: 1; }
  @media (hover: hover) { .lang-btn[aria-pressed="false"]:hover { background: var(--bg); } }

  /* Cabeçalho */
  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 24px; margin-bottom: 22px; }
  h1 { font: 800 clamp(2.1rem, 7vw, 3.4rem)/1 "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif; letter-spacing: -0.025em; margin: 0 0 8px; }
  .lead { margin: 0; color: var(--muted); max-width: 34ch; }
  .stats { flex: 0 1 290px; min-width: 220px; }
  .stats p { margin: 0 0 8px; font-size: 0.92rem; }
  .stats strong { font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 99px; background: var(--seg-bg); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--own); border-radius: inherit; transition: width 0.3s ease; }
  .stats .por-colecao { margin: 8px 0 0; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Controles */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .tabs { display: flex; gap: 2px; padding: 4px; background: var(--seg-bg); border-radius: 12px; flex: 0 1 auto; overflow-x: auto; }
  .tabs button { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: 600 14px "Figtree", system-ui, sans-serif; white-space: nowrap; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--seg-on-bg); color: var(--seg-on-fg); }
  .tabs .count { font-weight: 500; opacity: 0.85; font-variant-numeric: tabular-nums; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 100%; }
  .search { position: relative; flex: 2 1 180px; min-width: 0; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input, .filters select { height: 42px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); font: 500 14px "Figtree", system-ui, sans-serif; }
  .search input { width: 100%; padding: 0 12px 0 36px; }
  .filters select { flex: 1 1 140px; min-width: 0; padding: 0 10px; }

  /* Fichário */
  .binder {
    --b-fav: #FF8FA9; --b-own: #F8B4CB; --b-ink: #F3E9EE; --b-muted: #D9BFCB; --b-line: rgba(255, 255, 255, 0.2); --focus: #FFE3EA;
    position: relative; display: flex; padding: 14px 14px 14px 0; border-radius: 20px; background: #FCE5EF;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 0 0 1px rgba(122, 58, 82, 0.4), 0 20px 36px -20px rgba(90, 30, 55, 0.65);
  }
  .binder::before { content: ""; position: absolute; inset: 6px; border: 1.5px dashed rgba(122, 58, 82, 0.45); border-radius: 15px; pointer-events: none; }
  .spine { flex: none; width: 44px; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; }
  .spine i { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F4F6F9, #8E98A8 55%, #5A6474); box-shadow: 0 2px 4px rgba(90, 30, 55, 0.5); }
  .sheet { flex: 1; min-width: 0; padding: clamp(10px, 2.4vw, 22px); border-radius: 12px; background: var(--page); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06), 0 2px 8px rgba(58, 22, 38, 0.45); }
  .grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(8px, 2vw, 18px); }
  .grid:focus, .vazio:focus { outline: none; }

  .cell { container-type: inline-size; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .pocket { position: relative; display: flex; width: 100%; aspect-ratio: 63 / 88; padding: 3cqw; border-radius: 9px; border: 1px solid var(--b-line); background: rgba(255, 255, 255, 0.05); overflow: hidden; font: inherit; color: inherit; text-align: inherit; }
  button.pocket { appearance: none; cursor: zoom-in; }
  .pocket::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(115deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0) 36%, rgba(255, 255, 255, 0) 64%, rgba(255, 255, 255, 0.06) 100%); pointer-events: none; }
  .pocket img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 3.5cqw; transition: filter 0.2s ease; }
  .pocket img.ghost { filter: grayscale(1) brightness(0.55); }
  .fallback { flex: 1; display: grid; place-content: center; gap: 4px; padding: 8px; border-radius: 3.5cqw; background: rgba(255, 255, 255, 0.08); color: var(--b-ink); text-align: center; font-weight: 700; font-size: 12px; font-size: max(12px, 7cqw); overflow-wrap: anywhere; }
  .fallback small { font-weight: 500; color: var(--b-muted); font-size: 11px; font-size: max(11px, 6cqw); }
  .cell.empty .pocket { border-style: dashed; background: transparent; opacity: 0.5; }
  .cell.empty .ctrl, .cell.empty .cap, .cell.empty .flags { visibility: hidden; }

  .cap { display: flex; flex-direction: column; gap: 1px; min-width: 0; color: var(--b-ink); font-size: 12px; line-height: 1.3; }
  .cap .l1 { display: flex; gap: 5px; min-width: 0; }
  .cap .no { flex: none; color: #FFC9DA; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cap .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .cap .st { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--b-muted); font-size: 11px; }
  .pocket-wrap { position: relative; }
  .qty-btn { position: absolute; top: 5px; right: 5px; z-index: 2; min-width: 40px; height: 30px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 8px; border: 1px solid rgba(255, 255, 255, 0.55); border-radius: 99px; background: rgba(30, 14, 22, 0.82); color: #FFF3F7; font: 700 13px "Figtree", system-ui, sans-serif; font-variant-numeric: tabular-nums; cursor: pointer; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); }
  .qty-btn.on { background: #F8B4CB; border-color: #FFE3EA; color: #4A1B30; }
  .qty-btn[aria-expanded="true"] { box-shadow: 0 0 0 2px #FFE3EA, 0 2px 6px rgba(0, 0, 0, 0.35); }
  .qty-pop { position: absolute; top: 40px; right: 5px; z-index: 3; display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 14px; background: #FFF3F7; color: #3A1626; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45); --focus: #2338C8; }
  .qty-pop button { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid #B8607E; border-radius: 10px; background: #FFFFFF; color: #3A1626; cursor: pointer; }
  .qty-pop button:disabled { opacity: 0.35; cursor: default; }
  .qty-pop output { min-width: 28px; text-align: center; font: 800 16px "Figtree", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  @media (hover: hover) { .qty-pop button:not(:disabled):hover { background: #FCE5EF; } }
  .zoom-qty { align-items: center; justify-content: center; gap: 10px; color: #FFF3F7; font-weight: 600; }
  .zoom-qty .z-step { width: 44px; flex: none; display: grid; place-items: center; }
  .zoom-qty .z-step:disabled { opacity: 0.35; cursor: default; }
  .zoom-qty output { min-width: 32px; text-align: center; font: 800 20px "Figtree", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .vazio { display: grid; place-content: center; justify-items: center; gap: 12px; }
  .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.2); border-top-color: #F8B4CB; animation: girar 0.9s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .btn-retry { height: 40px; padding: 0 18px; border: 0; border-radius: 12px; background: #F8B4CB; color: #4A1B30; font: 700 14px "Figtree", system-ui, sans-serif; cursor: pointer; }

  .ctrl { display: flex; gap: 6px; }
  .ctrl button { height: 36px; border: 1px solid var(--b-line); border-radius: 10px; background: rgba(255, 255, 255, 0.06); color: var(--b-ink); cursor: pointer; font: 600 13px "Figtree", system-ui, sans-serif; }
  .btn-fav { flex: none; width: 38px; display: grid; place-items: center; }
  .btn-fav svg path { fill: none; }
  .btn-fav[aria-pressed="true"] { color: var(--b-fav); background: rgba(255, 143, 169, 0.16); border-color: rgba(255, 143, 169, 0.55); }
  .btn-fav[aria-pressed="true"] svg path { fill: currentColor; }
  .btn-own { flex: 1; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; white-space: nowrap; }
  .btn-own[aria-pressed="true"] { background: var(--b-own); border-color: var(--b-own); color: #4A1B30; }
  .ctrl svg { display: block; }
  .flags { display: flex; gap: 6px; }
  .flags button { flex: 1; min-width: 0; height: 34px; display: grid; place-items: center; padding: 0; border: 1px solid var(--b-line); border-radius: 10px; background: rgba(255, 255, 255, 0.06); cursor: pointer; }
  .flags button .fl { display: block; line-height: 0; opacity: 0.8; }
  .flags button .fl svg { display: block; width: 22px; height: auto; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3); }
  .flags button[aria-pressed="true"] { background: #F8B4CB; border-color: #FFE3EA; box-shadow: 0 0 0 1px #FFE3EA; }
  .flags button[aria-pressed="true"] .fl { opacity: 1; }
  .flags.big button { height: 44px; border-color: rgba(255, 255, 255, 0.3); }
  .flags.big button .fl svg { width: 30px; }
  @media (hover: hover) { .flags button[aria-pressed="false"]:hover { background: rgba(255, 255, 255, 0.14); } .flags button[aria-pressed="true"]:hover { background: #FBC8D9; } }
  @container (max-width: 112px) { .btn-own .lbl { display: none; } }
  @media (hover: hover) {
    .ctrl button:hover { background: rgba(255, 255, 255, 0.13); }
    .btn-own[aria-pressed="true"]:hover { background: #FBC8D9; }
    .btn-fav[aria-pressed="true"]:hover { background: rgba(255, 143, 169, 0.26); }
    .pager button:not(:disabled):hover { background: rgba(255, 255, 255, 0.14); }
    .tabs button[aria-pressed="false"]:hover { color: var(--text); }
  }

  /* Carta ampliada */
  .zoom { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); background: rgba(24, 8, 16, 0.95); overflow-y: auto; }
  .zoom-box { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(100%, 420px); margin: auto; color: #FFF3F7; }
  .zoom-close { position: absolute; top: -4px; right: -4px; z-index: 2; width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 50%; background: rgba(24, 8, 16, 0.7); color: #FFF3F7; cursor: pointer; }
  .zoom-stage { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; touch-action: pan-y; }
  .zoom-nav { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50%; background: rgba(255, 255, 255, 0.08); color: #FFF3F7; cursor: pointer; }
  .zoom-nav:disabled { opacity: 0.3; cursor: default; }
  .zoom-img { flex: 1; min-width: 0; display: grid; place-items: center; aspect-ratio: 63 / 88; max-height: min(66vh, 560px); }
  .zoom-img img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 4.5%; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55); }
  .zoom-img .fallback { width: 100%; height: 100%; font-size: 1.1rem; }
  .zoom-info { width: 100%; text-align: center; }
  .zoom-info h2 { margin: 0; font: 800 1.35rem/1.2 "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .zoom-info p { margin: 4px 0 0; font-size: 0.9rem; color: #E6C7D3; }
  .zoom-info .pos { font-variant-numeric: tabular-nums; }
  .zoom-ctrl { display: flex; gap: 8px; width: 100%; max-width: 340px; }
  .zoom-ctrl button { height: 44px; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 12px; background: rgba(255, 255, 255, 0.08); color: #FFF3F7; cursor: pointer; font: 700 15px "Figtree", system-ui, sans-serif; }
  .zoom-ctrl .z-fav { flex: none; width: 48px; display: grid; place-items: center; }
  .zoom-ctrl .z-fav svg path { fill: none; }
  .zoom-ctrl .z-fav[aria-pressed="true"] { color: #FF8FA9; background: rgba(255, 143, 169, 0.18); border-color: rgba(255, 143, 169, 0.6); }
  .zoom-ctrl .z-fav[aria-pressed="true"] svg path { fill: currentColor; }
  .zoom-ctrl .z-own { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .zoom-ctrl .z-own[aria-pressed="true"] { background: #F8B4CB; border-color: #F8B4CB; color: #4A1B30; }
  .zoom :focus-visible { outline-color: #FFE3EA; }
  @media (hover: hover) { .zoom-close:hover, .zoom-nav:not(:disabled):hover, .zoom-ctrl button:hover { background: rgba(255, 255, 255, 0.18); } .zoom-ctrl .z-own[aria-pressed="true"]:hover { background: #FBC8D9; } }
  @media (max-width: 420px) { .zoom-stage { gap: 4px; } .zoom-nav { width: 38px; height: 38px; } }
  @media (prefers-reduced-motion: no-preference) {
    .zoom { animation: zfade 0.18s ease-out; }
    .zoom-img img { animation: zpop 0.2s ease-out; }
    @keyframes zfade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes zpop { from { transform: scale(0.94); opacity: 0.6; } to { transform: none; opacity: 1; } }
  }

  .vazio { min-height: min(60vw, 360px); display: grid; place-items: center; margin: 0; padding: 24px; border: 1.5px dashed rgba(255, 255, 255, 0.25); border-radius: 12px; color: var(--b-muted); text-align: center; font-size: 0.95rem; }

  .pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: clamp(12px, 2.4vw, 20px); color: var(--b-ink); }
  .pager button { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--b-line); border-radius: 50%; background: rgba(255, 255, 255, 0.06); color: var(--b-ink); cursor: pointer; }
  .pager button:disabled { opacity: 0.35; cursor: default; }
  .pager .pg { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  .pager input { width: 56px; height: 36px; padding: 0 6px; text-align: center; border: 1px solid var(--b-line); border-radius: 10px; background: rgba(255, 255, 255, 0.08); color: var(--b-ink); font: 600 16px "Figtree", system-ui, sans-serif; -moz-appearance: textfield; }
  .pager input::-webkit-outer-spin-button, .pager input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; margin-top: 18px; color: var(--muted); font-size: 0.85rem; }
  .foot p { margin: 0; max-width: 52ch; }

      signOut: "ログアウト", errName: "トレーナー名を2文字以上で入力してください。", errEmail: "name@example.com のような有効なメールアドレスを入力してください。",
      enlarge: "カードを拡大", number: "番号", inColl: "所持", notInColl: "未所持", favLabel: "お気に入り", haveLabel: "持っている",
      btnHave: "持ってる", btnOwned: "所持", ownedIn: "所持している言語", langNames: { en: "英語", pt: "ポルトガル語", ja: "日本語" },
      copies: "枚数", qtyBtn: (nm, q) => `${nm} の枚数：${q}。枚数を変更`,
      qtyDec: nm => `${nm} を1枚減らす`, qtyInc: nm => `${nm} を1枚増やす`,
      copiesTotal: n => `合計 ${n} 枚`,
      loading: "TCGdex からすべてのセットを読み込み中…",
      loadErr: "TCGdex からカードを読み込めませんでした。インターネット接続を確認して、もう一度お試しください。", retry: "再試行",
      allOwned: "おめでとう！すべてのカードを持っています。",
      emptyOwned: "コレクションは空です。「すべて」で持っているカードの「持ってる」をタップしてください。",
      emptyFav: "お気に入りはまだありません。カードのハートをタップするとここに保存されます。",
      none: "カードが見つかりません。別の名前や番号を試すか、絞り込みを解除してください。"
    }
  };
  const LANGS = ["en", "pt", "ja"];
  const t = (k, ...a) => {
    const d = I18N[conta.cfg.lang] || I18N.en;
    const v = d[k] !== undefined ? d[k] : I18N.en[k];
    return typeof v === "function" ? v(...a) : v;
  };

  const ICON = {
    heart: '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.5C1.3 8.4 3.3 5 6.8 5c2 0 3.5 1.1 5.2 3.1C13.7 6.1 15.2 5 17.2 5c3.5 0 5.5 3.4 4.3 6.5C19.5 16.4 12 21 12 21z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
    check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    plus:  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>',
    minus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>',
    stack: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="7" y="3" width="12" height="16" rx="2" stroke="currentColor" stroke-width="2.2"/><path d="M4 7v12a2 2 0 0 0 2 2h9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>'
  };
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const $ = id => document.getElementById(id);
  const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const pad3 = n => String(n).padStart(3, "0");
  const collator = new Intl.Collator("en", { numeric: true, sensitivity: "base" });
  // "006" -> "6", "TG01" -> "tg1", "025/165" -> "25"
  const numKey = s => String(s).toLowerCase().replace(/^#/, "").split("/")[0].replace(/\d+/g, d => String(parseInt(d, 10)));
  const ehNumero = tk => /^#?[a-z]{0,4}\d+[a-z]?(\/\d+)?$/.test(tk);

  /* ---------- Coleção, quantidades, idiomas e favoritas (salvas no navegador) ---------- */
  const KEY = "fichario-pokemon-v3";
  const KEY_OLD = "fichario-pokemon-v2";
  // ids antigos (versão com 151 e 30 anos fixos) -> ids da TCGdex
  const migrar = id => {
    let m;
    if ((m = /^151-(\d+)$/.exec(id))) return "sv03.5-" + pad3(m[1]);
    if ((m = /^30c-(\d+)$/.exec(id))) return "30th-c-" + pad3(m[1]);
    if ((m = /^30-(\d+)$/.exec(id))) return "30th-" + pad3(m[1]);
    return id;
  };
  const SEED_QTY = { "sv03.5-006": 1, "sv03.5-025": 2, "sv03.5-151": 1, "30th-023": 1, "30th-066": 1, "30th-c-001": 1, "30th-c-014": 1 };
  const SEED_FAV = ["sv03.5-006", "sv03.5-151", "30th-c-001"];
  function carregar() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const o = JSON.parse(raw);
        const qty = {}, langs = {};
        Object.entries(o.qty || {}).forEach(([id, n]) => { n = parseInt(n, 10); if (n > 0) qty[id] = Math.min(999, n); });
        Object.keys(qty).forEach(id => {
          const l = Array.isArray((o.langs || {})[id]) ? o.langs[id].filter(x => LANGS.includes(x)) : [];
          langs[id] = l.length ? l : ["en"];
        });
        return { qty, langs, fav: new Set(o.fav || []) };
      }
      const old = localStorage.getItem(KEY_OLD);
      if (old) {
        const o = JSON.parse(old);
        const qty = {}, langs = {};
        (o.own || []).forEach(id => {
          const nid = migrar(id);
          qty[nid] = 1;
          const l = Array.isArray((o.langs || {})[id]) ? o.langs[id].filter(x => LANGS.includes(x)) : [];
          langs[nid] = l.length ? l : ["en"];
        });
        return { qty, langs, fav: new Set((o.fav || []).map(migrar)) };
      }
    } catch (e) { /* usa os exemplos */ }
    const langs = {};
    Object.keys(SEED_QTY).forEach(id => { langs[id] = ["en"]; });
    return { qty: Object.assign({}, SEED_QTY), langs, fav: new Set(SEED_FAV) };
  }
  function salvar() {
    try { localStorage.setItem(KEY, JSON.stringify({ qty: state.qty, langs: state.langs, fav: [...state.fav] })); } catch (e) { /* segue sem salvar */ }
  }

  /* ---------- Conta e configurações (salvas no navegador) ---------- */
  const KEY_CONTA = "fichario-pokemon-conta-v2";
  const reduzir = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function carregarConta() {
    const padrao = { perfil: null, cfg: { cinza: true, anim: !reduzir, ordem: "num", lang: "en" } };
    try {
      const raw = localStorage.getItem(KEY_CONTA);
      if (raw) {
        const o = JSON.parse(raw);
        const perfil = o.perfil && o.perfil.nome ? { nome: String(o.perfil.nome), email: String(o.perfil.email || "") } : null;
        const cfg = Object.assign(padrao.cfg, o.cfg || {});
        if (cfg.ordem !== "nome") cfg.ordem = "num";
        if (!LANGS.includes(cfg.lang)) cfg.lang = "en";
        return { perfil, cfg };
      }
    } catch (e) { /* usa o padrão */ }
    return padrao;
  }
  function salvarConta() {
    try { localStorage.setItem(KEY_CONTA, JSON.stringify(conta)); } catch (e) { /* segue sem salvar */ }
  }

  const saved = carregar();
  const conta = carregarConta();
  const state = {
    tab: "todas", q: "", posse: "", serie: "", set: "", page: 0,
    qty: saved.qty, langs: saved.langs, fav: saved.fav, own: new Set(Object.keys(saved.qty)),
    status: "loading", qtyOpen: null, lista: []
  };

  /* ---------- Cartas vindas da API ---------- */
  let CARTAS = [];
  const POR_ID = new Map();
  let SETS = {};      // id -> { id, name, serie, serieName, official, total }
  let SERIES = [];    // [{ id, name, sets: [ids] }] da mais nova para a mais antiga

  async function getJSON(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status + " " + url);
    return r.json();
  }
  async function carregarDados() {
    state.status = "loading";
    render();
    try {
      const [lista, cards] = await Promise.all([getJSON(API + "/series"), getJSON(API + "/cards")]);
      const detalhes = await Promise.all(lista.filter(s => !SKIP_SERIES.has(s.id))
        .map(s => getJSON(API + "/series/" + encodeURIComponent(s.id)).catch(() => null)));
      montar(detalhes.filter(Boolean), cards);
      state.status = "ok";
    } catch (e) {
      console.error(e);
      state.status = "error";
    }
    preencherFiltros();
    render();
  }

  function montar(detalhes, cards) {
    SETS = {}; SERIES = [];
    detalhes.sort((a, b) => String(b.releaseDate || "").localeCompare(String(a.releaseDate || "")));
    let ordem = 0;
    const ordemSet = {};
    detalhes.forEach(s => {
      const ids = [];
      (s.sets || []).slice().reverse().forEach(st => {
        if (SETS[st.id]) return;
        SETS[st.id] = { id: st.id, name: st.name, serie: s.id, serieName: s.name, official: (st.cardCount && st.cardCount.official) || 0, total: 0 };
        ordemSet[st.id] = ordem++;
        ids.push(st.id);
      });
      if (ids.length) SERIES.push({ id: s.id, name: s.name, sets: ids });
    });
    const achaSet = c => {
      if (c.localId !== undefined && c.id.endsWith("-" + c.localId)) {
        const sid = c.id.slice(0, c.id.length - String(c.localId).length - 1);
        if (SETS[sid]) return sid;
      }
      let p = c.id.length;
      while ((p = c.id.lastIndexOf("-", p - 1)) > 0) { const sid = c.id.slice(0, p); if (SETS[sid]) return sid; }
      return null;
    };
    CARTAS = [];
    POR_ID.clear();
    cards.forEach(c => {
      if (!c || !c.id || !c.name) return;
      const sid = achaSet(c);
      if (!sid) return;
      const lid = c.localId !== undefined ? String(c.localId) : c.id.slice(sid.length + 1);
      const num = /^\d+$/.test(lid) ? parseInt(lid, 10) : NaN;
      const fb = OFICIAL[sid] && !isNaN(num) ? OFICIAL[sid](num) : "";
      const carta = { id: c.id, set: sid, lid, n: c.name, nn: norm(c.name), key: numKey(lid), img: c.image || "", fb, ord: 0 };
      CARTAS.push(carta);
      SETS[sid].total++;
    });
    CARTAS.sort((a, b) => ordemSet[a.set] - ordemSet[b.set] || collator.compare(a.lid, b.lid));
    CARTAS.forEach((c, i) => { c.ord = i; POR_ID.set(c.id, c); });
  }

  const imgPequena = c => c.img ? c.img + "/low.webp" : c.fb;
  const imgGrande = c => c.img ? c.img + "/high.webp" : c.fb;
  const numeroTxt = c => {
    const s = SETS[c.set];
    return /^\d+$/.test(c.lid) && s && s.official ? `${c.lid}/${String(s.official).padStart(c.lid.length, "0")}` : c.lid;
  };
  const setNome = c => (SETS[c.set] ? SETS[c.set].name : "");

  /* ---------- Lista filtrada e desenho ---------- */
  const mq = window.matchMedia("(max-width: 479px)");
  let porPagina = mq.matches ? 6 : 9;
  const grid = $("grid"), vazio = $("vazio"), prev = $("prev"), next = $("next"), pgIn = $("pgIn");

  const ORDENS = {
    num: (a, b) => a.ord - b.ord,
    nome: (a, b) => collator.compare(a.n, b.n) || a.ord - b.ord
  };
  function casaBusca(c, tks) {
    for (const tk of tks) {
      if (ehNumero(tk)) { if (c.key !== numKey(tk) && !c.nn.includes(tk)) return false; }
      else if (!c.nn.includes(tk)) return false;
    }
    return true;
  }
  function filtradas() {
    const tks = norm(state.q.trim()).split(/\s+/).filter(Boolean);
    const lista = CARTAS.filter(c => {
      if (state.tab === "colecao" && !state.own.has(c.id)) return false;
      if (state.tab === "favoritas" && !state.fav.has(c.id)) return false;
      if (state.posse === "tenho" && !state.own.has(c.id)) return false;
      if (state.posse === "faltam" && state.own.has(c.id)) return false;
      if (state.serie && SETS[c.set].serie !== state.serie) return false;
      if (state.set && c.set !== state.set) return false;
      if (tks.length && !casaBusca(c, tks)) return false;
      return true;
    });
    return conta.cfg.ordem === "nome" ? lista.sort(ORDENS.nome) : lista;
  }

  const LANG_FLAG = { en: "us", pt: "br", ja: "jp" };
  function flagsHTML(c, big) {
    const have = state.langs[c.id] || [];
    const nm = t("langNames");
    return (big ? "" : `<div class="flags" role="group" aria-label="${esc(t("ownedIn"))}: ${esc(c.n)}, ${t("number")} ${esc(numeroTxt(c))}">`) +
      LANGS.map(l => `<button type="button" data-act="flag" data-l="${l}" aria-pressed="${have.includes(l)}" aria-label="${esc(t("ownedIn"))} ${esc(nm[l])}: ${esc(c.n)}, ${t("number")} ${esc(numeroTxt(c))}"><span class="fl">${FLAGS[LANG_FLAG[l]]}</span></button>`).join("") +
      (big ? "" : "</div>");
  }
  function qtyPopHTML(c) {
    const q = state.qty[c.id] || 0;
    return `<div class="qty-pop" role="group" aria-label="${esc(t("copies"))}: ${esc(c.n)}">
      <button type="button" data-act="dec" aria-label="${esc(t("qtyDec", c.n))}" ${q === 0 ? "disabled" : ""}>${ICON.minus}</button>
      <output aria-live="polite">${q}</output>
      <button type="button" data-act="inc" aria-label="${esc(t("qtyInc", c.n))}">${ICON.plus}</button>
    </div>`;
  }

  function cartaHTML(c) {
    const own = state.own.has(c.id), fav = state.fav.has(c.id);
    const q = state.qty[c.id] || 0;
    const cinza = !own && conta.cfg.cinza;
    const num = numeroTxt(c);
    const rotulo = `${c.n}, ${t("number")} ${num}, ${setNome(c)}, ${own ? t("inColl") : t("notInColl")}`;
    const src = imgPequena(c);
    const aberto = state.qtyOpen === c.id;
    return `<li class="cell" data-id="${esc(c.id)}">
      <div class="pocket-wrap">
        <button type="button" class="pocket" data-act="zoom" aria-label="${esc(t("enlarge"))}: ${esc(rotulo)}">
          ${src ? `<img class="${cinza ? "ghost" : ""}" src="${esc(src)}" alt="" width="245" height="342" loading="lazy" decoding="async" referrerpolicy="no-referrer">` : fallbackHTML(c)}
        </button>
        <button type="button" class="qty-btn${q ? " on" : ""}" data-act="qty" aria-expanded="${aberto}" aria-label="${esc(t("qtyBtn", c.n, q))}">${ICON.stack}<span>${q}</span></button>
        ${aberto ? qtyPopHTML(c) : ""}
      </div>
      <div class="cap" title="${esc(c.n)} #${esc(num)}">
        <span class="l1"><span class="no">#${esc(num)}</span><span class="nm">${esc(c.n)}</span></span>
        <span class="st">${esc(setNome(c))}</span>
      </div>
      <div class="ctrl">
        <button type="button" class="btn-fav" data-act="fav" aria-pressed="${fav}" aria-label="${esc(t("favLabel"))}: ${esc(c.n)}, ${t("number")} ${esc(num)}, ${esc(setNome(c))}">${ICON.heart}</button>
        <button type="button" class="btn-own" data-act="own" aria-pressed="${own}" aria-label="${esc(t("haveLabel"))}: ${esc(c.n)}, ${t("number")} ${esc(num)}, ${esc(setNome(c))}">${own ? ICON.check : ICON.plus}<span class="lbl">${own ? t("btnOwned") : t("btnHave")}</span></button>
      </div>
      ${flagsHTML(c)}
    </li>`;
  }
  const fallbackHTML = c => `<div class="fallback"><span>${esc(c.n)}</span><small>#${esc(numeroTxt(c))} · ${esc(setNome(c))}</small></div>`;
  const vagaHTML = () => `<li class="cell empty" aria-hidden="true"><div class="pocket-wrap"><div class="pocket"></div></div><div class="cap"><span class="l1">&nbsp;</span><span class="st">&nbsp;</span></div><div class="ctrl"><button type="button" tabindex="-1"></button></div><div class="flags"><button type="button" tabindex="-1"></button></div></li>`;

  function mensagemVazia() {
    const semFiltro = !state.q.trim() && !state.set && !state.serie;
    if (semFiltro && state.posse === "faltam" && state.tab === "todas") return t("allOwned");
    if (semFiltro && !state.posse) {
      if (state.tab === "colecao") return t("emptyOwned");
      if (state.tab === "favoritas") return t("emptyFav");
    }
    return t("none");
  }

  function render() {
    const carregado = state.status === "ok";
    const lista = carregado ? filtradas() : [];
    state.lista = lista;
    const paginas = Math.max(1, Math.ceil(lista.length / porPagina));
    state.page = Math.min(state.page, paginas - 1);

    if (!carregado) {
      grid.hidden = true; vazio.hidden = false;
      vazio.setAttribute("aria-busy", String(state.status === "loading"));
      vazio.innerHTML = state.status === "loading"
        ? `<span class="spin" aria-hidden="true"></span><span>${esc(t("loading"))}</span>`
        : `<span>${esc(t("loadErr"))}</span><button type="button" class="btn-retry" id="retry">${esc(t("retry"))}</button>`;
    } else if (!lista.length) {
      grid.hidden = true; vazio.hidden = false; vazio.removeAttribute("aria-busy"); vazio.textContent = mensagemVazia();
    } else {
      vazio.hidden = true; grid.hidden = false;
      const fatia = lista.slice(state.page * porPagina, state.page * porPagina + porPagina);
      let html = fatia.map(cartaHTML).join("");
      for (let i = fatia.length; i < porPagina; i++) html += vagaHTML();
      grid.innerHTML = html;
    }

    pgIn.value = state.page + 1;
    pgIn.max = paginas;
    pgIn.disabled = !carregado;
    $("pgDe").textContent = t("of", paginas);
    prev.disabled = !carregado || state.page === 0;
    next.disabled = !carregado || state.page >= paginas - 1;

    const total = CARTAS.length;
    let tem = 0, copias = 0;
    CARTAS.forEach(c => { if (state.own.has(c.id)) { tem++; copias += state.qty[c.id] || 0; } });
    $("statsLine").innerHTML = t("stats", tem, total.toLocaleString());
    const pct = total ? tem / total * 100 : 0;
    $("barFill").style.width = pct + "%";
    $("bar").setAttribute("aria-valuenow", Math.round(pct));
    let extra = t("copiesTotal", copias);
    if (carregado && state.set && SETS[state.set]) {
      const s = SETS[state.set];
      const noSet = CARTAS.reduce((n, c) => n + (c.set === s.id && state.own.has(c.id) ? 1 : 0), 0);
      extra = `${s.name}: ${noSet}/${s.total} · ` + extra;
    }
    $("porColecao").textContent = extra;
    $("cTodas").textContent = total.toLocaleString();
    $("cColecao").textContent = tem;
    $("cFavoritas").textContent = CARTAS.length ? CARTAS.reduce((n, c) => n + (state.fav.has(c.id) ? 1 : 0), 0) : state.fav.size;
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tab === state.tab)));
  }

  function virarPagina(dir) {
    grid.style.setProperty("--dx", (dir * 14) + "px");
    grid.classList.remove("flip");
    void grid.offsetWidth;
    grid.classList.add("flip");
  }

  // Se a imagem não carregar: tenta a da galeria oficial e, se não der, mostra nome e número
  grid.addEventListener("error", e => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement)) return;
    const cell = img.closest(".cell");
    const c = POR_ID.get(cell.dataset.id);
    if (!c) return;
    if (c.fb && img.dataset.fb !== "1" && img.src !== c.fb) { img.dataset.fb = "1"; img.src = c.fb; return; }
    const div = document.createElement("div");
    div.innerHTML = fallbackHTML(c);
    img.replaceWith(div.firstElementChild);
  }, true);

  /* ---------- Quantidade, posse e idiomas ---------- */
  function setQty(id, n) {
    n = Math.max(0, Math.min(999, n));
    if (n === 0) { delete state.qty[id]; delete state.langs[id]; state.own.delete(id); return; }
    if (!state.qty[id] && !(state.langs[id] || []).length) state.langs[id] = [conta.cfg.lang];
    state.qty[id] = n;
    state.own.add(id);
  }
  function toggleOwn(id) { setQty(id, state.own.has(id) ? 0 : 1); }
  function toggleLang(id, l) {
    const a = (state.langs[id] || []).slice();
    const i = a.indexOf(l);
    if (i >= 0) a.splice(i, 1); else a.push(l);
    if (!a.length) { setQty(id, 0); return; }
    state.langs[id] = LANGS.filter(x => a.includes(x));
    if (!state.qty[id]) state.qty[id] = 1;
    state.own.add(id);
  }

  function focarNaCelula(id, seletor) {
    const alvo = grid.querySelector(`.cell[data-id="${CSS.escape(id)}"] ${seletor}`);
    if (alvo) { alvo.focus({ preventScroll: true }); return alvo; }
    (grid.hidden ? vazio : grid).focus({ preventScroll: true });
    return null;
  }

  grid.addEventListener("click", e => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    const id = b.closest(".cell").dataset.id;
    const act = b.dataset.act;
    if (act === "zoom") { state.qtyOpen = null; abrirZoom(id); return; }
    if (act === "qty") {
      state.qtyOpen = state.qtyOpen === id ? null : id;
      render();
      focarNaCelula(id, state.qtyOpen ? '[data-act="inc"]' : '[data-act="qty"]');
      return;
    }
    const lg = b.dataset.l;
    if (act === "fav") { if (state.fav.has(id)) state.fav.delete(id); else state.fav.add(id); }
    else if (act === "flag") toggleLang(id, lg);
    else if (act === "inc") setQty(id, (state.qty[id] || 0) + 1);
    else if (act === "dec") setQty(id, (state.qty[id] || 0) - 1);
    else toggleOwn(id);
    salvar();
    render();
    let sel = `[data-act="${act}"]`;
    if (act === "flag") sel = `[data-l="${lg}"]`;
    if (act === "dec" && !state.qty[id]) sel = '[data-act="inc"]';
    const novo = focarNaCelula(id, sel);
    if (novo && (act === "fav" || act === "own")) novo.classList.add("pop");
  });
  function fecharQty(focar) {
    if (!state.qtyOpen) return;
    const id = state.qtyOpen;
    state.qtyOpen = null;
    render();
    if (focar) focarNaCelula(id, '[data-act="qty"]');
  }
  document.addEventListener("click", e => {
    if (state.qtyOpen && !e.target.closest(".pocket-wrap")) fecharQty(false);
  });
  vazio.addEventListener("click", e => { if (e.target.closest("#retry")) carregarDados(); });

  document.querySelector(".tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-tab]");
    if (!b) return;
    state.tab = b.dataset.tab; state.page = 0; state.qtyOpen = null; render();
  });
  let buscaTimer;
  $("busca").addEventListener("input", e => {
    clearTimeout(buscaTimer);
    buscaTimer = setTimeout(() => { state.q = e.target.value; state.page = 0; state.qtyOpen = null; render(); }, 120);
  });
  $("fPosse").addEventListener("change", e => { state.posse = e.target.value; state.page = 0; render(); });
  $("fSerie").addEventListener("change", e => {
    state.serie = e.target.value;
    if (state.set && SETS[state.set] && state.serie && SETS[state.set].serie !== state.serie) state.set = "";
    state.page = 0; preencherFiltros(); render();
  });
  $("fSet").addEventListener("change", e => { state.set = e.target.value; state.page = 0; render(); });

  prev.addEventListener("click", () => {
    if (state.page > 0) { state.page--; state.qtyOpen = null; render(); virarPagina(-1); if (prev.disabled) next.focus(); }
  });
  next.addEventListener("click", () => {
    state.page++; state.qtyOpen = null; render(); virarPagina(1); if (next.disabled) prev.focus();
  });
  pgIn.addEventListener("change", () => {
    const max = Number(pgIn.max) || 1;
    const v = Math.min(max, Math.max(1, parseInt(pgIn.value, 10) || 1));
    state.page = v - 1; state.qtyOpen = null; render(); virarPagina(1);
  });
  pgIn.addEventListener("keydown", e => { if (e.key === "Enter") pgIn.blur(); });

  mq.addEventListener("change", e => {
    const primeira = state.page * porPagina;
    porPagina = e.matches ? 6 : 9;
    state.page = Math.floor(primeira / porPagina);
    render();
  });

  // Limpar em dois toques, sem janela de confirmação
  const reset = $("reset");
  let armado = false, timer;
  reset.addEventListener("click", () => {
    if (!armado) {
      armado = true;
      reset.textContent = t("resetArm");
      timer = setTimeout(() => { armado = false; reset.textContent = t("reset"); }, 3500);
    } else {
      clearTimeout(timer); armado = false;
      reset.textContent = t("reset");
      state.own.clear(); state.fav.clear(); state.langs = {}; state.qty = {}; state.qtyOpen = null; salvar(); render();
    }
  });

  /* ---------- Carta ampliada ---------- */
  const zoom = $("zoom");
  const zState = { ids: [], i: 0, origem: null };

  function desenharZoom() {
    const c = POR_ID.get(zState.ids[zState.i]);
    const own = state.own.has(c.id), fav = state.fav.has(c.id);
    const q = state.qty[c.id] || 0;
    const num = numeroTxt(c);
    const box = $("zImg");
    box.innerHTML = "";
    const src = imgGrande(c);
    if (src) {
      const img = new Image();
      img.referrerPolicy = "no-referrer";
      img.alt = `${c.n}, ${t("number")} ${num}, ${setNome(c)}`;
      img.addEventListener("error", () => {
        if (c.fb && img.dataset.fb !== "1" && img.src !== c.fb) { img.dataset.fb = "1"; img.src = c.fb; return; }
        box.innerHTML = fallbackHTML(c);
      });
      img.src = src;
      box.appendChild(img);
    } else box.innerHTML = fallbackHTML(c);
    $("zNome").textContent = `${c.n} #${num}`;
    $("zDet").textContent = `${setNome(c)} · ${SETS[c.set] ? SETS[c.set].serieName : ""}`;
    $("zPos").textContent = t("zPos", zState.i + 1, zState.ids.length);
    const f = $("zFav"), o = $("zOwn");
    f.setAttribute("aria-pressed", String(fav));
    f.setAttribute("aria-label", t("favLabel") + ": " + c.n);
    f.innerHTML = ICON.heart;
    o.setAttribute("aria-pressed", String(own));
    o.setAttribute("aria-label", t("haveLabel") + ": " + c.n);
    o.innerHTML = (own ? ICON.check : ICON.plus) + `<span>${own ? t("btnOwned") : t("btnHave")}</span>`;
    $("zQtyLbl").textContent = t("copies");
    $("zQtyVal").textContent = q;
    $("zDec").disabled = q === 0;
    $("zDec").setAttribute("aria-label", t("qtyDec", c.n));
    $("zInc").setAttribute("aria-label", t("qtyInc", c.n));
    $("zFlags").setAttribute("aria-label", t("ownedIn"));
    $("zFlags").innerHTML = flagsHTML(c, true);
    $("zPrev").disabled = zState.i === 0;
    $("zNext").disabled = zState.i >= zState.ids.length - 1;
  }
  function abrirZoom(id) {
    const ids = state.lista.map(c => c.id);
    const i = ids.indexOf(id);
    if (i < 0) return;
    zState.ids = ids; zState.i = i;
    zState.origem = id;
    desenharZoom();
    zoom.hidden = false;
    wrap.inert = true;
    $("zClose").focus();
  }
  function fecharZoom() {
    if (zoom.hidden) return;
    zoom.hidden = true;
    wrap.inert = false;
    const atual = zState.ids[zState.i];
    // leva o fichário até a página da carta que estava aberta
    const pos = state.lista.findIndex(c => c.id === atual);
    if (pos >= 0 && Math.floor(pos / porPagina) !== state.page) { state.page = Math.floor(pos / porPagina); render(); }
    const alvo = grid.querySelector(`.cell[data-id="${CSS.escape(atual)}"] [data-act="zoom"]`) || sideTab;
    alvo.focus({ preventScroll: false });
  }
  function irZoom(d) {
    const n = zState.i + d;
    if (n < 0 || n >= zState.ids.length) return;
    zState.i = n;
    desenharZoom();
  }
  function depoisZoom(foco) { salvar(); render(); desenharZoom(); if (foco) { const b = typeof foco === "string" ? $(foco) : foco(); if (b) b.focus(); } }
  $("zClose").addEventListener("click", fecharZoom);
  $("zPrev").addEventListener("click", () => irZoom(-1));
  $("zNext").addEventListener("click", () => irZoom(1));
  $("zFav").addEventListener("click", () => { const id = zState.ids[zState.i]; if (state.fav.has(id)) state.fav.delete(id); else state.fav.add(id); depoisZoom(); });
  $("zOwn").addEventListener("click", () => { toggleOwn(zState.ids[zState.i]); depoisZoom(); });
  $("zInc").addEventListener("click", () => { const id = zState.ids[zState.i]; setQty(id, (state.qty[id] || 0) + 1); depoisZoom("zInc"); });
  $("zDec").addEventListener("click", () => { const id = zState.ids[zState.i]; setQty(id, (state.qty[id] || 0) - 1); depoisZoom(state.qty[id] ? "zDec" : "zInc"); });
  $("zFlags").addEventListener("click", e => {
    const b = e.target.closest("[data-l]");
    if (!b) return;
    const l = b.dataset.l;
    toggleLang(zState.ids[zState.i], l);
    depoisZoom(() => $("zFlags").querySelector(`[data-l="${l}"]`));
  });
  zoom.addEventListener("click", e => { if (e.target === zoom) fecharZoom(); });
  document.addEventListener("keydown", e => {
    if (!zoom.hidden) {
      if (e.key === "Escape") { e.preventDefault(); fecharZoom(); }
      else if (e.key === "ArrowLeft") irZoom(-1);
      else if (e.key === "ArrowRight") irZoom(1);
      return;
    }
    if (e.key === "Escape" && state.qtyOpen) { e.preventDefault(); fecharQty(true); }
  });
  let toqueX = null;
  $("zStage").addEventListener("touchstart", e => { toqueX = e.touches[0].clientX; }, { passive: true });
  $("zStage").addEventListener("touchend", e => {
    if (toqueX === null) return;
    const dx = e.changedTouches[0].clientX - toqueX;
    toqueX = null;
    if (Math.abs(dx) > 50) irZoom(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* ---------- Painel lateral: cadastro e configurações ---------- */
  const wrap = $("wrap"), painel = $("painel"), scrim = $("scrim"), sideTab = $("sideTab");
  function abrirPainel() {
    painel.classList.add("open"); scrim.hidden = false;
    sideTab.setAttribute("aria-expanded", "true");
    wrap.inert = true; $("fechar").focus();
  }
  function fecharPainel() {
    painel.classList.remove("open"); scrim.hidden = true;
    sideTab.setAttribute("aria-expanded", "false");
    wrap.inert = false; sideTab.focus();
  }
  sideTab.addEventListener("click", abrirPainel);
  $("fechar").addEventListener("click", fecharPainel);
  scrim.addEventListener("click", fecharPainel);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && painel.classList.contains("open")) fecharPainel(); });

  const contaBox = $("contaBox");
  function renderConta() {
    if (conta.perfil) {
      const p = conta.perfil;
      contaBox.innerHTML = `
        <div class="conta-ok" id="contaOk" tabindex="-1">
          <span class="avatar" aria-hidden="true">${esc(p.nome.charAt(0).toUpperCase())}</span>
          <div><p class="nome">${esc(p.nome)}</p><p class="email">${esc(p.email)}</p></div>
        </div>
        <p class="nota">${esc(t("acctDone"))}</p>
        <button type="button" class="btn-sec" id="btnSair">${esc(t("signOut"))}</button>`;
    } else {
      contaBox.innerHTML = `
        <p class="nota" style="margin-top:0">${esc(t("acctIntro"))}</p>
        <div class="field"><label for="inNome">${esc(t("name"))}</label><input id="inNome" type="text" autocomplete="nickname" maxlength="30"></div>
        <div class="field"><label for="inEmail">${esc(t("email"))}</label><input id="inEmail" type="email" inputmode="email" autocomplete="email"></div>
        <p class="erro" id="erro" role="alert"></p>
        <button type="button" class="btn-primary" id="btnCriar">${esc(t("create"))}</button>
        <p class="nota">${esc(t("acctNote"))}</p>`;
    }
  }
  function criarConta() {
    const nome = $("inNome").value.trim();
    const email = $("inEmail").value.trim();
    const erro = $("erro");
    if (nome.length < 2) { erro.textContent = t("errName"); $("inNome").focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { erro.textContent = t("errEmail"); $("inEmail").focus(); return; }
    conta.perfil = { nome, email };
    salvarConta(); renderConta(); $("contaOk").focus();
  }
  contaBox.addEventListener("click", e => {
    if (e.target.closest("#btnCriar")) criarConta();
    if (e.target.closest("#btnSair")) { conta.perfil = null; salvarConta(); renderConta(); $("inNome").focus(); }
  });
  contaBox.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.matches("#inNome, #inEmail")) { e.preventDefault(); criarConta(); }
  });

  function aplicarCfg() {
    document.documentElement.classList.toggle("sem-anim", !conta.cfg.anim);
    $("cfgCinza").setAttribute("aria-checked", String(conta.cfg.cinza));
    $("cfgAnim").setAttribute("aria-checked", String(conta.cfg.anim));
    $("cfgOrdem").value = conta.cfg.ordem;
  }
  $("cfgCinza").addEventListener("click", () => { conta.cfg.cinza = !conta.cfg.cinza; salvarConta(); aplicarCfg(); render(); });
  $("cfgAnim").addEventListener("click", () => { conta.cfg.anim = !conta.cfg.anim; salvarConta(); aplicarCfg(); });
  $("cfgOrdem").addEventListener("change", e => { conta.cfg.ordem = e.target.value; state.page = 0; salvarConta(); render(); });

  /* ---------- Idioma (bandeiras) ---------- */
  const FLAGS = (() => {
    let us = '<svg width="30" height="20" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#FFFFFF"/>';
    for (let i = 0; i < 13; i += 2) us += `<rect y="${(i * 20 / 13).toFixed(2)}" width="30" height="${(20 / 13).toFixed(2)}" fill="#B22234"/>`;
    us += '<rect width="13" height="10.77" fill="#3C3B6E"/>';
    for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) us += `<circle cx="${(1.3 + c * 2.4 + (r % 2) * 1.2).toFixed(1)}" cy="${(1.4 + r * 2.4).toFixed(1)}" r="0.55" fill="#FFFFFF"/>`;
    us += '</svg>';
    const br = '<svg width="30" height="20" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#009C3B"/><path d="M15 2.2L27 10 15 17.8 3 10z" fill="#FFDF00"/><circle cx="15" cy="10" r="4.1" fill="#002776"/><path d="M11 9.2c2.6-.7 5.6-.3 8 1.2" stroke="#FFFFFF" stroke-width="0.9" fill="none"/></svg>';
    const jp = '<svg width="30" height="20" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#FFFFFF"/><circle cx="15" cy="10" r="6" fill="#BC002D"/></svg>';
    return { us, br, jp };
  })();
  document.querySelectorAll("[data-flag]").forEach(el => { el.innerHTML = FLAGS[el.dataset.flag]; });

  function preencherFiltros() {
    const sel = (id, html, val) => { const el = $(id); el.innerHTML = html; el.value = val; if (el.value !== val) el.value = ""; };
    sel("fPosse", `<option value="">${esc(t("sit"))}</option><option value="tenho">${esc(t("fOwn"))}</option><option value="faltam">${esc(t("fMissing"))}</option>`, state.posse);
    sel("fSerie", `<option value="">${esc(t("serie"))}</option>` + SERIES.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join(""), state.serie);
    const grupos = state.serie ? SERIES.filter(s => s.id === state.serie) : SERIES;
    const opts = s => s.sets.map(id => `<option value="${esc(id)}">${esc(SETS[id].name)}</option>`).join("");
    sel("fSet", `<option value="">${esc(t("set"))}</option>` + (state.serie
      ? grupos.map(opts).join("")
      : grupos.map(s => `<optgroup label="${esc(s.name)}">${opts(s)}</optgroup>`).join("")), state.set);
    sel("cfgOrdem", `<option value="num">${esc(t("ordNum"))}</option><option value="nome">${esc(t("ordName"))}</option>`, conta.cfg.ordem);
  }
  function aplicarIdioma() {
    const d = I18N[conta.cfg.lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
    document.querySelectorAll("[data-i18n-ph]").forEach(el => el.setAttribute("placeholder", t(el.dataset.i18nPh)));
    $("langNote").textContent = t("langNote");
    document.querySelectorAll(".lang-btn").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === conta.cfg.lang)));
    reset.textContent = t(armado ? "resetArm" : "reset");
    preencherFiltros();
    const tinhaForm = !conta.perfil && $("inNome") ? [$("inNome").value, $("inEmail").value] : null;
    renderConta();
    if (tinhaForm) { $("inNome").value = tinhaForm[0]; $("inEmail").value = tinhaForm[1]; }
  }
  document.querySelector(".langs").addEventListener("click", e => {
    const b = e.target.closest(".lang-btn");
    if (!b || b.dataset.lang === conta.cfg.lang) return;
    conta.cfg.lang = b.dataset.lang;
    salvarConta();
    aplicarIdioma();
    render();
    if (!zoom.hidden) desenharZoom();
  });

  aplicarIdioma();
  aplicarCfg();
  carregarDados();
})();
</script>
</body>
</html>
