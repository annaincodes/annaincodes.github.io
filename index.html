<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokémon Binder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FCE5EF;
    --surface: #FFFFFF;
    --text: #3A1626;
    --muted: #7A3A52;
    --line: #B8607E;
    --seg-bg: #F3BBD0;
    --seg-on-bg: #4A1B30;
    --seg-on-fg: #FFFFFF;
    --focus: #2338C8;
    --own: #D94F86;
    --page: #2A1822;
    --acc: #F8B4CB; --acc-hover: #FBC8D9; --acc-ink: #4A1B30; --acc-soft: #FFC9DA;
    --b-ink: #F3E9EE; --b-muted: #D9BFCB; --zoom-bg: rgba(24, 8, 16, 0.95);
    --cover: #FCE5EF;
    --stitch: rgba(122, 58, 82, 0.45);
    --field-fg: #3A1626;
    --field-muted: #7A3A52;
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* Cores do fichário (escolhidas nas bolinhas do canto inferior direito) */
  html[data-tema="pastel"] { --bg: #F8C8DC; --cover: #F8C8DC; --text: #3A1626; --muted: #6B2A45; --line: #A24D72; --seg-bg: #FBDDE9; --seg-on-bg: #4A1B30; --seg-on-fg: #FFFFFF; --stitch: rgba(106, 40, 70, 0.5); --field-fg: #3A1626; --field-muted: #6B2A45; --page: #331A28; --acc: #F6A9C6; --acc-hover: #F9C3D8; --acc-ink: #4A1B30; --acc-soft: #FFBFD7; --b-ink: #F7E6EE; --b-muted: #DDB8C9; --zoom-bg: rgba(28, 9, 18, 0.95); --own: #C93C77; }
  html[data-tema="azul"] { --bg: #9FC5E8; --cover: #9FC5E8; --text: #102A43; --muted: #1F4466; --line: #3D6990; --seg-bg: #C6DDF2; --seg-on-bg: #102A43; --seg-on-fg: #FFFFFF; --stitch: rgba(16, 42, 67, 0.4); --field-fg: #102A43; --field-muted: #1F4466; --page: #13263A; --acc: #9FC5E8; --acc-hover: #B9D7F1; --acc-ink: #102A43; --acc-soft: #BCD9F3; --b-ink: #E8F1FA; --b-muted: #B0C6DB; --zoom-bg: rgba(7, 17, 28, 0.95); --own: #2F6FAD; }
  html[data-tema="verde"] { --bg: #C8E1BE; --cover: #C8E1BE; --text: #1C3517; --muted: #36552D; --line: #5B8650; --seg-bg: #E0EFD9; --seg-on-bg: #1C3517; --seg-on-fg: #FFFFFF; --stitch: rgba(28, 53, 23, 0.4); --field-fg: #1C3517; --field-muted: #36552D; --page: #172818; --acc: #C8E1BE; --acc-hover: #D9EBD1; --acc-ink: #1C3517; --acc-soft: #D2EAC8; --b-ink: #EDF5E9; --b-muted: #B9CEB1; --zoom-bg: rgba(9, 19, 9, 0.95); --own: #4B873C; }
  html[data-tema="amarelo"] { --bg: #FFE599; --cover: #FFE599; --text: #3A2C00; --muted: #5C470A; --line: #A3852A; --seg-bg: #FFF0C4; --seg-on-bg: #3A2C00; --seg-on-fg: #FFFFFF; --stitch: rgba(58, 44, 0, 0.4); --field-fg: #3A2C00; --field-muted: #5C470A; --page: #2D2510; --acc: #FFE599; --acc-hover: #FFEDB8; --acc-ink: #3A2C00; --acc-soft: #FFE9A8; --b-ink: #FBF5E4; --b-muted: #D8CDAA; --zoom-bg: rgba(22, 17, 4, 0.95); --own: #B07F00; }
  html[data-tema="cinza"] { --bg: #5B5B5B; --cover: #5B5B5B; --text: #F5F5F5; --muted: #DADADA; --line: #A8A8A8; --seg-bg: #6F6F6F; --seg-on-bg: #F5F5F5; --seg-on-fg: #262626; --stitch: rgba(255, 255, 255, 0.4); --focus: #FFE3EA; --own: #E6E6E6; --field-fg: #262626; --field-muted: #555555; --page: #252525; --acc: #D9D9D9; --acc-hover: #E8E8E8; --acc-ink: #262626; --acc-soft: #E2E2E2; --b-ink: #F2F2F2; --b-muted: #C2C2C2; --zoom-bg: rgba(16, 16, 16, 0.95); }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    transition: background 0.25s ease, color 0.25s ease;
    color: var(--text);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .wrap { max-width: 1040px; margin: 0 auto; padding: clamp(18px, 4vw, 40px) clamp(14px, 4vw, 24px) 96px 52px; }
  .temas { position: fixed; right: calc(env(safe-area-inset-right, 0px) + 14px); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); z-index: 15; display: flex; gap: 4px; padding: 5px; border-radius: 99px; background: rgba(255, 255, 255, 0.92); box-shadow: 0 6px 20px -6px rgba(0, 0, 0, 0.45); --focus: #2338C8; }
  .temas button { width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; }
  .temas button i { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--sw); box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, 0.28); transition: transform 0.15s ease; }
  .temas button i svg { opacity: 0; }
  .temas button[aria-pressed="true"] i { box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, 0.28), 0 0 0 2px #FFFFFF, 0 0 0 4px #3A1626; }
  .temas button[aria-pressed="true"] i svg { opacity: 1; }
  @media (hover: hover) { .temas button:hover i { transform: scale(1.1); } }

  /* Aba vertical na lateral esquerda */
  .side-tab {
    position: fixed; left: env(safe-area-inset-left, 0px); top: 50%; transform: translateY(-50%); z-index: 10;
    display: inline-flex; align-items: center; gap: 10px; padding: 16px 9px;
    writing-mode: vertical-rl; border: 0; border-radius: 0 12px 12px 0;
    background: #4A1B30; color: #FFFFFF; font: 600 14px "Figtree", system-ui, sans-serif; cursor: pointer;
    box-shadow: 2px 4px 14px -4px rgba(58, 22, 38, 0.55);
  }
  .side-tab[aria-expanded="true"] { visibility: hidden; }
  @media (hover: hover) { .side-tab:hover { background: #63284A; } }

  .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(58, 22, 38, 0.45); }
  .painel {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 30; width: min(340px, 88vw);
    overflow-y: auto; overscroll-behavior: contain;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px calc(env(safe-area-inset-bottom, 0px) + 24px);
    --bg: #FCE5EF; --text: #3A1626; --muted: #7A3A52; --line: #B8607E; --seg-bg: #F3BBD0; --seg-on-bg: #4A1B30; --focus: #2338C8;
    background: var(--surface); color: var(--text); box-shadow: 0 0 40px rgba(58, 22, 38, 0.4);
    transform: translateX(-100%); visibility: hidden; transition: transform 0.25s ease, visibility 0s linear 0.25s;
  }
  .painel.open { transform: none; visibility: visible; transition: transform 0.25s ease; }
  .painel-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .painel h2 { margin: 0; font: 800 1.4rem/1.15 "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif; letter-spacing: -0.015em; }
  .painel h3 { margin: 24px 0 8px; font-size: 1rem; font-weight: 700; }
  .fechar { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--text); cursor: pointer; }
  .nota { margin: 10px 0 0; color: var(--muted); font-size: 0.86rem; line-height: 1.45; }
  .field { display: grid; gap: 6px; margin-top: 12px; }
  .field label { font-weight: 600; font-size: 0.9rem; }
  .painel input[type="text"], .painel input[type="email"], .painel select {
    width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
    background: #FFFFFF; color: var(--text); font: 500 16px "Figtree", system-ui, sans-serif;
  }
  .erro { min-height: 1.3em; margin: 8px 0 0; color: #A3112F; font-size: 0.86rem; font-weight: 600; }
  .btn-primary, .btn-sec { width: 100%; height: 44px; margin-top: 6px; border-radius: 12px; font: 700 15px "Figtree", system-ui, sans-serif; cursor: pointer; }
  .btn-primary { border: 0; background: #4A1B30; color: #FFFFFF; }
  .btn-sec { border: 1px solid var(--line); background: transparent; color: var(--text); margin-top: 12px; }
  @media (hover: hover) { .btn-primary:hover { background: #63284A; } .btn-sec:hover, .fechar:hover { background: var(--bg); } }
  .conta-ok { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
  .conta-ok:focus { outline: none; }
  .avatar { flex: none; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; background: var(--seg-bg); color: #4A1B30; font: 800 1.25rem "Bricolage Grotesque", system-ui, sans-serif; }
  .conta-ok p { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .conta-ok .nome { font-weight: 700; }
  .conta-ok .email { color: var(--muted); font-size: 0.88rem; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-top: 1px solid rgba(184, 96, 126, 0.3); }
  .row p { margin: 0; }
  .row-t { font-weight: 600; font-size: 0.93rem; }
  .row-d { color: var(--muted); font-size: 0.82rem; line-height: 1.4; }
  .row.col { display: block; }
  .row.col .field { margin-top: 0; }
  .switch { position: relative; flex: none; width: 56px; height: 32px; padding: 0; border: 1.5px solid #B8607E; border-radius: 99px; background: #FBDFEA; cursor: pointer; transition: background 0.18s ease; }
  .switch .knob { position: absolute; top: 2px; left: 2px; width: 25px; height: 25px; display: block; transition: transform 0.18s ease; filter: drop-shadow(0 1px 2px rgba(90, 30, 55, 0.45)); }
  .switch .knob svg { display: block; width: 100%; height: 100%; }
  .switch[aria-checked="true"] { background: #F6A3C0; }
  .switch[aria-checked="true"] .knob { transform: translateX(24px); }
  .langs { display: grid; gap: 8px; margin-top: 8px; }
  .lang-btn { display: flex; align-items: center; gap: 12px; width: 100%; height: 46px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: #FFFFFF; color: var(--text); font: 600 15px "Figtree", system-ui, sans-serif; text-align: left; cursor: pointer; }
  .lang-btn[aria-pressed="true"] { background: var(--seg-on-bg); border-color: var(--seg-on-bg); color: #FFFFFF; }
  .lang-btn .flag { flex: none; display: block; width: 30px; height: 20px; }
  .lang-btn .flag svg { display: block; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25); }
  .lang-btn .tick { margin-left: auto; opacity: 0; }
  .lang-btn[aria-pressed="true"] .tick { opacity: 1; }
  @media (hover: hover) { .lang-btn[aria-pressed="false"]:hover { background: var(--bg); } }

  /* Cabeçalho */
  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 24px; margin-bottom: 22px; }
  h1 { font: 800 clamp(2.1rem, 7vw, 3.4rem)/1 "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif; letter-spacing: -0.025em; margin: 0 0 8px; }
  .lead { margin: 0; color: var(--muted); max-width: 34ch; }
  .stats { flex: 0 1 290px; min-width: 220px; }
  .stats p { margin: 0 0 8px; font-size: 0.92rem; }
  .stats strong { font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 99px; background: var(--seg-bg); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--own); border-radius: inherit; transition: width 0.3s ease; }
  .stats .por-colecao { margin: 8px 0 0; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Áreas e Deck Builder */
  .areas { display: flex; gap: 6px; margin: 0 0 18px; }
  .areas button { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border: 1.5px solid var(--line); border-radius: 99px; background: transparent; color: var(--text); font: 700 15px "Figtree", system-ui, sans-serif; cursor: pointer; }
  .areas button[aria-pressed="true"] { background: var(--seg-on-bg); border-color: var(--seg-on-bg); color: var(--seg-on-fg); }
  @media (hover: hover) { .areas button[aria-pressed="false"]:hover { background: var(--seg-bg); } .pill:not(:disabled):hover { background: var(--seg-bg); } .pill.on:hover { opacity: 0.9; background: var(--seg-on-bg); } }
  .deck-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .deck-pick { display: flex; align-items: center; gap: 8px; flex: 1 1 240px; min-width: 0; font-weight: 700; font-size: 0.92rem; }
  .deck-pick select { flex: 1; min-width: 0; height: 42px; padding: 0 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--field-fg); font: 600 15px "Figtree", system-ui, sans-serif; }
  .pill { height: 42px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--text); font: 700 14px "Figtree", system-ui, sans-serif; white-space: nowrap; cursor: pointer; }
  .pill:disabled { opacity: 0.45; cursor: default; }
  .pill.on { background: var(--seg-on-bg); border-color: var(--seg-on-bg); color: var(--seg-on-fg); }
  .deck-form { margin: 0 0 12px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; }
  .deck-form label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 0.92rem; }
  .deck-form-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .deck-form input { flex: 1 1 200px; min-width: 0; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--field-fg); font: 500 16px "Figtree", system-ui, sans-serif; }
  .deck-form .erro { margin: 6px 0 0; min-height: 0; }
  .deck-sem { display: grid; justify-items: start; gap: 10px; margin: 6px 0 20px; padding: 20px; border: 1.5px dashed var(--line); border-radius: 16px; }
  .deck-sem p { margin: 0; }
  .deck-aviso { margin: 0 0 12px; font-size: 0.88rem; font-weight: 600; color: var(--muted); }
  .deck-aviso.ok { color: var(--text); }
  .deck-badge { position: absolute; top: 5px; right: 5px; z-index: 2; min-width: 34px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0 8px; border: 1px solid #FFFFFF; border-radius: 99px; background: var(--acc); color: var(--acc-ink); font: 800 13px "Figtree", system-ui, sans-serif; font-variant-numeric: tabular-nums; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); }
  .dctl { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .dctl .dlbl { flex: 1 1 auto; min-width: 0; color: var(--b-muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .dctl button, .btn-step { flex: none; width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 1px solid var(--b-line); border-radius: 9px; background: rgba(255, 255, 255, 0.06); color: var(--b-ink); cursor: pointer; }
  .dctl button:disabled, .btn-step:disabled { opacity: 0.35; cursor: default; }
  .dctl output { min-width: 22px; text-align: center; color: var(--b-ink); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  .dctl.own.ok output { color: var(--acc-soft); }
  .dstatus { display: flex; align-items: center; gap: 4px; margin: 0; font-size: 11.5px; font-weight: 700; color: var(--b-muted); }
  .dstatus.ok { color: var(--acc-soft); }
  .dstatus.miss { color: #FFB3A6; }
  .ctrl .btn-step { height: 36px; width: 36px; border-radius: 10px; }
  .btn-add { flex: 1; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; white-space: nowrap; }
  .btn-add.on { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
  .btn-add .n { min-width: 20px; height: 20px; display: inline-grid; place-items: center; padding: 0 5px; border-radius: 99px; background: rgba(0, 0, 0, 0.15); font-size: 12px; font-variant-numeric: tabular-nums; }
  .dinfo { margin: 0; color: var(--b-muted); font-size: 11.5px; }
  @container (max-width: 175px) { .dctl .dlbl { flex-basis: 100%; } .btn-add .lbl { display: none; } }
  @media (hover: hover) { .dctl button:not(:disabled):hover, .btn-step:not(:disabled):hover { background: rgba(255, 255, 255, 0.14); } .btn-add.on:hover { background: var(--acc-hover); } }
  .cell.empty .dctl, .cell.empty .dstatus, .cell.empty .dinfo { visibility: hidden; }

  /* Pokédex */
  .dex-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: clamp(8px, 1.6vw, 14px); }
  @media (max-width: 859px) { .dex-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 479px) { .dex-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .dex-tile { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px 10px; border: 1px solid var(--b-line); border-radius: 14px; background: rgba(255, 255, 255, 0.07); color: var(--b-ink); font: inherit; cursor: pointer; transition: transform 0.15s ease, background 0.15s ease; }
  .dex-art { display: grid; place-items: center; width: 100%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, 0.16) 0 55%, transparent 56%); }
  .dex-art img { display: block; width: 92%; height: 92%; object-fit: contain; }
  .dex-sem-img { font: 800 1.6rem "Bricolage Grotesque", system-ui, sans-serif; color: var(--b-muted); }
  .dex-no { font-size: 11px; font-weight: 700; color: var(--acc-soft); font-variant-numeric: tabular-nums; }
  .dex-nm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; }
  @media (hover: hover) { .dex-tile:hover { background: rgba(255, 255, 255, 0.14); transform: translateY(-2px); } }
  .dex-modal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-start; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 16px) 12px calc(env(safe-area-inset-bottom, 0px) + 16px); background: var(--zoom-bg); overflow-y: auto; }
  .ficha { position: relative; width: min(100%, 860px); margin: auto 0; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); border-radius: 22px; background: #FFFFFF; color: #2A1C22; overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); --focus: #2338C8; }
  .ficha-topo { --tc: #E9DDE3; position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 14px 20px; background: linear-gradient(160deg, color-mix(in srgb, var(--tc) 85%, #FFFFFF) 0%, var(--tc) 100%); }
  .ficha-barra { display: flex; align-items: center; gap: 6px; width: 100%; }
  .ficha-pos { flex: 1; text-align: center; font-size: 0.85rem; font-weight: 700; color: rgba(0, 0, 0, 0.7); font-variant-numeric: tabular-nums; }
  .ficha-btn { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.75); color: #2A1C22; cursor: pointer; }
  .ficha-btn:disabled { opacity: 0.35; cursor: default; }
  .ficha-art { display: grid; place-items: center; width: min(100%, 300px); aspect-ratio: 1; }
  .ficha-art img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.28)); }
  .ficha-shiny { height: 36px; padding: 0 16px; border: 0; border-radius: 99px; background: rgba(255, 255, 255, 0.85); color: #2A1C22; font: 700 13px "Figtree", system-ui, sans-serif; cursor: pointer; }
  .ficha-shiny[aria-pressed="true"] { background: #2A1C22; color: #FFFFFF; }
  .ficha-info { min-width: 0; padding: 20px 22px 24px; }
  .ficha-num { margin: 0; font-weight: 800; color: #7A5A68; font-variant-numeric: tabular-nums; }
  .ficha-info h2 { margin: 0 0 2px; font: 800 clamp(1.6rem, 4vw, 2.2rem)/1.1 "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif; letter-spacing: -0.02em; }
  .ficha-info h3 { margin: 20px 0 8px; font-size: 0.82rem; letter-spacing: 0.06em; text-transform: uppercase; color: #7A5A68; }
  .ficha-genus { margin: 0 0 10px; color: #5C4651; font-weight: 600; }
  .ficha-tipos { display: flex; flex-wrap: wrap; gap: 6px; }
  .tipo { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 12px; border-radius: 99px; font-weight: 800; font-size: 13px; }
  .tipo b { font-weight: 800; opacity: 0.85; }
  .tag { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 99px; background: #F2E8EC; color: #4A1B30; font-weight: 700; font-size: 13px; }

  // Imagens da galeria oficial (inglês) como reserva, caso a TCGdex ainda não tenha a imagem

    "sv03.5": n => n >= 1 && n <= 207 ? CDN + "151/en-us/SV3pt5_EN_" + n + ".png" : "",
    "30th": n => n >= 1 && n <= 158 ? CDN + "30th-celebration/en-us/2M6P_EN_" + n + ".png" : "",

  const I18N = {
    en: {
      areasAria: "Sections", areaBinder: "Binder", areaDecks: "Deck Builder",

      deckNoneLine: "No deck selected",
      dTabDeck: "In deck", dTabAdd: "Add cards",

      langNote: "サイトの言語を変更します。カード名と画像は常に英語です。各カードの旗で、どの言語版を持っているかを記録できます。",
      acctIntro: "アカウントを作成して、バインダーを自分用にしましょう。", name: "トレーナー名", email: "メールアドレス",
      create: "アカウントを作成", acctNote: "現在、アカウントはこのブラウザにのみ保存されます。",
      acctDone: "このブラウザにアカウントを作成しました。パスワードログインと他の端末からの利用は次のバージョンで対応予定です。",
      signOut: "ログアウト", errName: "トレーナー名を2文字以上で入力してください。", errEmail: "name@example.com のような有効なメールアドレスを入力してください。",
      enlarge: "カードを拡大", number: "番号", inColl: "所持", notInColl: "未所持", favLabel: "お気に入り", haveLabel: "持っている",
      btnHave: "持ってる", btnOwned: "所持", ownedIn: "所持している言語", langNames: { en: "英語", pt: "ポルトガル語", ja: "日本語" },
      copies: "枚数", qtyBtn: (nm, q) => `${nm} の枚数：${q}。枚数を変更`,
      qtyDec: nm => `${nm} を1枚減らす`, qtyInc: nm => `${nm} を1枚増やす`,
      copiesTotal: n => `合計 ${n} 枚`,
      loading: "TCGdex からすべてのセットを読み込み中…",
      loadErr: "TCGdex からカードを読み込めませんでした。インターネット接続を確認して、もう一度お試しください。広告ブロッカーを使っている場合は api.tcgdex.net を許可してください。", retry: "再試行", techDetail: "詳細",
      allOwned: "おめでとう！すべてのカードを持っています。",
      emptyOwned: "コレクションは空です。「すべて」で持っているカードの「持ってる」をタップしてください。",
      emptyFav: "ほしいものリストは空です。欲しいカードのハートをタップしてください。",
      emptyStar: "お気に入りカードはまだありません。好きなカードの星をタップしてください。",
      none: "カードが見つかりません。別の名前や番号を試すか、絞り込みを解除してください。"
    }
  };
  const LANGS = ["en", "pt", "ja"];
  const TEMAS = ["rosa", "pastel", "azul", "verde", "amarelo", "cinza"];
  const t = (k, ...a) => {
    const d = I18N[conta.cfg.lang] || I18N.en;
    const v = d[k] !== undefined ? d[k] : I18N.en[k];
    return typeof v === "function" ? v(...a) : v;
  };

  const ICON = {
    heart: '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.5C1.3 8.4 3.3 5 6.8 5c2 0 3.5 1.1 5.2 3.1C13.7 6.1 15.2 5 17.2 5c3.5 0 5.5 3.4 4.3 6.5C19.5 16.4 12 21 12 21z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
    check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    star: '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.85-4.2 4.1 1 5.8L12 16.9l-5.2 2.75 1-5.8-4.2-4.1 5.8-.85z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
    plus:  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>',
    minus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>',
    stack: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="7" y="3" width="12" height="16" rx="2" stroke="currentColor" stroke-width="2.2"/><path d="M4 7v12a2 2 0 0 0 2 2h9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>'
  };
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const $ = id => document.getElementById(id);
  const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const pad3 = n => String(n).padStart(3, "0");
  const collator = new Intl.Collator("en", { numeric: true, sensitivity: "base" });
  // "006" -> "6", "TG01" -> "tg1", "025/165" -> "25"
  const numKey = s => String(s).toLowerCase().replace(/^#/, "").split("/")[0].replace(/\d+/g, d => String(parseInt(d, 10)));
  const ehNumero = tk => /^#?[a-z]{0,4}\d+[a-z]?(\/\d+)?$/.test(tk);

  /* ---------- Coleção, quantidades, idiomas e favoritas (salvas no navegador) ---------- */
  const KEY = "fichario-pokemon-v3";
  const KEY_OLD = "fichario-pokemon-v2";
  // ids antigos (versão com 151 e 30 anos fixos) -> ids da TCGdex
  const migrar = id => {
    let m;
    if ((m = /^151-(\d+)$/.exec(id))) return "sv03.5-" + pad3(m[1]);
    if ((m = /^30c-(\d+)$/.exec(id))) return "30th-c-" + pad3(m[1]);
    if ((m = /^30-(\d+)$/.exec(id))) return "30th-" + pad3(m[1]);
    return id;
  };
  const SEED_QTY = { "sv03.5-006": 1, "sv03.5-025": 2, "sv03.5-151": 1, "30th-023": 1, "30th-066": 1, "30th-c-001": 1, "30th-c-014": 1 };
  const SEED_FAV = ["sv03.5-006", "sv03.5-151", "30th-c-001"];
  const SEED_STAR = ["sv03.5-025"];
  function carregar() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const o = JSON.parse(raw);
        const qty = {}, langs = {};
        Object.entries(o.qty || {}).forEach(([id, n]) => { n = parseInt(n, 10); if (n > 0) qty[id] = Math.min(999, n); });
        Object.keys(qty).forEach(id => {
          const l = Array.isArray((o.langs || {})[id]) ? o.langs[id].filter(x => LANGS.includes(x)) : [];
          langs[id] = l.length ? l : ["en"];
        });
        return { qty, langs, fav: new Set(o.fav || []), star: new Set(o.star || []) };
      }
      const old = localStorage.getItem(KEY_OLD);
      if (old) {
        const o = JSON.parse(old);
        const qty = {}, langs = {};
        (o.own || []).forEach(id => {
          const nid = migrar(id);
          qty[nid] = 1;
          const l = Array.isArray((o.langs || {})[id]) ? o.langs[id].filter(x => LANGS.includes(x)) : [];
          langs[nid] = l.length ? l : ["en"];
        });
        return { qty, langs, fav: new Set((o.fav || []).map(migrar)), star: new Set() };
      }
    } catch (e) { /* usa os exemplos */ }
    const langs = {};
    Object.keys(SEED_QTY).forEach(id => { langs[id] = ["en"]; });
    return { qty: Object.assign({}, SEED_QTY), langs, fav: new Set(SEED_FAV), star: new Set(SEED_STAR) };
  }
  function salvar() {
    try { localStorage.setItem(KEY, JSON.stringify({ qty: state.qty, langs: state.langs, fav: [...state.fav], star: [...state.star] })); } catch (e) { /* segue sem salvar */ }
  }

  /* ---------- Conta e configurações (salvas no navegador) ---------- */
  const KEY_CONTA = "fichario-pokemon-conta-v2";
  const reduzir = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function carregarConta() {
    const padrao = { perfil: null, cfg: { cinza: true, anim: !reduzir, ordem: "num", lang: "en", tema: "rosa", area: "binder" } };
    try {
      const raw = localStorage.getItem(KEY_CONTA);
      if (raw) {
        const o = JSON.parse(raw);
        const perfil = o.perfil && o.perfil.nome ? { nome: String(o.perfil.nome), email: String(o.perfil.email || "") } : null;
        const cfg = Object.assign(padrao.cfg, o.cfg || {});
        if (cfg.ordem !== "nome") cfg.ordem = "num";
        if (!LANGS.includes(cfg.lang)) cfg.lang = "en";
        if (!TEMAS.includes(cfg.tema)) cfg.tema = "rosa";
        if (!["binder", "decks", "dex"].includes(cfg.area)) cfg.area = "binder";
        return { perfil, cfg };
      }
    } catch (e) { /* usa o padrão */ }
    return padrao;
  }
  function salvarConta() {
    try { localStorage.setItem(KEY_CONTA, JSON.stringify(conta)); } catch (e) { /* segue sem salvar */ }
  }

  const saved = carregar();
  const conta = carregarConta();
  const state = {
    tab: "todas", q: "", posse: "", serie: "", set: "", page: 0,
    qty: saved.qty, langs: saved.langs, fav: saved.fav, star: saved.star, own: new Set(Object.keys(saved.qty)),
    status: "loading", qtyOpen: null, lista: []
  };

  /* ---------- Cartas vindas da API ---------- */
  let CARTAS = [];
  const POR_ID = new Map();
  let SETS = {};      // id -> { id, name, serie, serieName, official, total }
  let SERIES = [];    // [{ id, name, sets: [ids] }] da mais nova para a mais antiga

  async function getJSON(url, tentativas = 2) {
    let ultimo;
    for (let i = 0; i < tentativas; i++) {
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error("HTTP " + r.status + " — " + url.replace(API, ""));
        return await r.json();
      } catch (e) {
        ultimo = e;
        await new Promise(res => setTimeout(res, 700 * (i + 1)));
      }
    }
    throw ultimo;
  }

  /* Cópia local dos dados (IndexedDB) para abrir rápido e funcionar mesmo se a API falhar */
  const CACHE_DB = "fichario-pokemon-cache", CACHE_KEY = "en-v1", CACHE_HORAS = 24;
  function abrirDB() {
    return new Promise((ok, falha) => {
      try {
        const req = indexedDB.open(CACHE_DB, 1);
        req.onupgradeneeded = () => req.result.createObjectStore("dados");
        req.onsuccess = () => ok(req.result);
        req.onerror = () => falha(req.error);
      } catch (e) { falha(e); }
    });
  }
  async function lerCache() {
    try {
      const db = await abrirDB();
      return await new Promise(ok => {
        const r = db.transaction("dados").objectStore("dados").get(CACHE_KEY);
        r.onsuccess = () => ok(r.result || null);
        r.onerror = () => ok(null);
      });
    } catch (e) { return null; }
  }
  async function gravarCache(valor) {
    try {
      const db = await abrirDB();
      db.transaction("dados", "readwrite").objectStore("dados").put(valor, CACHE_KEY);
    } catch (e) { /* segue sem cache */ }
  }

  // Busca as cartas coleção por coleção (plano B se a lista completa falhar)
  async function cartasPorColecao(detalhes) {
    const ids = [];
    detalhes.forEach(s => (s.sets || []).forEach(st => ids.push(st.id)));
    const todas = [];
    let feitos = 0, i = 0;
    async function trabalhador() {
      while (i < ids.length) {
        const id = ids[i++];
        try {
          const set = await getJSON(API + "/sets/" + encodeURIComponent(id));
          (set.cards || []).forEach(c => todas.push(c));
        } catch (e) { console.warn("Set não carregou:", id, e); }
        feitos++;
        state.progresso = `${feitos}/${ids.length}`;
        if (feitos % 10 === 0 || feitos === ids.length) atualizar();
      }
    }
    await Promise.all(Array.from({ length: 6 }, trabalhador));
    if (!todas.length) throw new Error("No set could be loaded");
    return todas;
  }

  async function carregarDados() {
    state.status = "loading"; state.erro = ""; state.progresso = "";
    atualizar();
    const cache = await lerCache();
    if (cache && Date.now() - cache.quando < CACHE_HORAS * 3600e3) {
      montar(cache.detalhes, cache.cards);
      state.status = "ok";
      preencherFiltros(); atualizar();
      return;
    }
    try {
      const lista = await getJSON(API + "/series");
      const detalhes = (await Promise.all(lista.filter(s => !SKIP_SERIES.has(s.id))
        .map(s => getJSON(API + "/series/" + encodeURIComponent(s.id)).catch(() => null)))).filter(Boolean);
      if (!detalhes.length) throw new Error("No series could be loaded");
      let cards;
      try { cards = await getJSON(API + "/cards"); }
      catch (e) { console.warn("Lista completa falhou, carregando por coleção:", e); cards = await cartasPorColecao(detalhes); }
      montar(detalhes, cards);
      state.status = "ok";
      gravarCache({ quando: Date.now(), detalhes, cards });
    } catch (e) {
      console.error(e);
      if (cache) { montar(cache.detalhes, cache.cards); state.status = "ok"; }
      else { state.status = "error"; state.erro = (e && e.message) || String(e); }
    }
    preencherFiltros();
    atualizar();
  }

  function montar(detalhes, cards) {
    SETS = {}; SERIES = [];
    detalhes.sort((a, b) => String(b.releaseDate || "").localeCompare(String(a.releaseDate || "")));
    let ordem = 0;
    const ordemSet = {};
    detalhes.forEach(s => {
      const ids = [];
      (s.sets || []).slice().reverse().forEach(st => {
        if (SETS[st.id]) return;
        SETS[st.id] = { id: st.id, name: st.name, serie: s.id, serieName: s.name, official: (st.cardCount && st.cardCount.official) || 0, total: 0 };
        ordemSet[st.id] = ordem++;
        ids.push(st.id);
      });
      if (ids.length) SERIES.push({ id: s.id, name: s.name, sets: ids });
    });
    const achaSet = c => {
      if (c.localId !== undefined && c.id.endsWith("-" + c.localId)) {
        const sid = c.id.slice(0, c.id.length - String(c.localId).length - 1);
        if (SETS[sid]) return sid;
      }
      let p = c.id.length;
      while ((p = c.id.lastIndexOf("-", p - 1)) > 0) { const sid = c.id.slice(0, p); if (SETS[sid]) return sid; }
      return null;
    };
    CARTAS = [];
    POR_ID.clear();
    cards.forEach(c => {
      if (!c || !c.id || !c.name) return;
      const sid = achaSet(c);
      if (!sid) return;
      const lid = c.localId !== undefined ? String(c.localId) : c.id.slice(sid.length + 1);
      const num = /^\d+$/.test(lid) ? parseInt(lid, 10) : NaN;
      const fb = OFICIAL[sid] && !isNaN(num) ? OFICIAL[sid](num) : "";
      const carta = { id: c.id, set: sid, lid, n: c.name, nn: norm(c.name), key: numKey(lid), img: c.image || "", fb, ord: 0 };
      CARTAS.push(carta);
      SETS[sid].total++;
    });
    CARTAS.sort((a, b) => ordemSet[a.set] - ordemSet[b.set] || collator.compare(a.lid, b.lid));
    CARTAS.forEach((c, i) => { c.ord = i; POR_ID.set(c.id, c); });
  }

  const imgPequena = c => c.img ? c.img + "/low.webp" : c.fb;
  const imgGrande = c => c.img ? c.img + "/high.webp" : c.fb;
  const numeroTxt = c => {
    const s = SETS[c.set];
    return /^\d+$/.test(c.lid) && s && s.official ? `${c.lid}/${String(s.official).padStart(c.lid.length, "0")}` : c.lid;
  };
  const setNome = c => (SETS[c.set] ? SETS[c.set].name : "");

  /* ---------- Lista filtrada e desenho ---------- */
  const mqLarga = window.matchMedia("(min-width: 860px)"), mqEstreita = window.matchMedia("(max-width: 479px)");
  const calcPorPagina = () => mqLarga.matches ? 12 : mqEstreita.matches ? 6 : 9;
  let porPagina = calcPorPagina();
  const grid = $("grid"), vazio = $("vazio"), prev = $("prev"), next = $("next"), pgIn = $("pgIn");

  const ORDENS = {
    num: (a, b) => a.ord - b.ord,
    nome: (a, b) => collator.compare(a.n, b.n) || a.ord - b.ord
  };
  function casaBusca(c, tks) {
    for (const tk of tks) {
      if (ehNumero(tk)) { if (c.key !== numKey(tk) && !c.nn.includes(tk)) return false; }
      else if (!c.nn.includes(tk)) return false;
    }
    return true;
  }
  function filtradas() {
    const tks = norm(state.q.trim()).split(/\s+/).filter(Boolean);
    const lista = CARTAS.filter(c => {
      if (state.tab === "colecao" && !state.own.has(c.id)) return false;
      if (state.tab === "favoritas" && !state.fav.has(c.id)) return false;
      if (state.tab === "estrelas" && !state.star.has(c.id)) return false;
      if (state.posse === "tenho" && !state.own.has(c.id)) return false;
      if (state.posse === "faltam" && state.own.has(c.id)) return false;
      if (state.serie && SETS[c.set].serie !== state.serie) return false;
      if (state.set && c.set !== state.set) return false;
      if (tks.length && !casaBusca(c, tks)) return false;
      return true;
    });
    return conta.cfg.ordem === "nome" ? lista.sort(ORDENS.nome) : lista;
  }

  const LANG_FLAG = { en: "us", pt: "br", ja: "jp" };
  function flagsHTML(c, big) {
    const have = state.langs[c.id] || [];
    const nm = t("langNames");
    return (big ? "" : `<div class="flags" role="group" aria-label="${esc(t("ownedIn"))}: ${esc(c.n)}, ${t("number")} ${esc(numeroTxt(c))}">`) +
      LANGS.map(l => `<button type="button" data-act="flag" data-l="${l}" aria-pressed="${have.includes(l)}" aria-label="${esc(t("ownedIn"))} ${esc(nm[l])}: ${esc(c.n)}, ${t("number")} ${esc(numeroTxt(c))}"><span class="fl">${FLAGS[LANG_FLAG[l]]}</span></button>`).join("") +
      (big ? "" : "</div>");
  }
  function qtyPopHTML(c) {
    const q = state.qty[c.id] || 0;
    return `<div class="qty-pop" role="group" aria-label="${esc(t("copies"))}: ${esc(c.n)}">
      <button type="button" data-act="dec" aria-label="${esc(t("qtyDec", c.n))}" ${q === 0 ? "disabled" : ""}>${ICON.minus}</button>
      <output aria-live="polite">${q}</output>
      <button type="button" data-act="inc" aria-label="${esc(t("qtyInc", c.n))}">${ICON.plus}</button>
    </div>`;
  }

  function cartaHTML(c) {
    const own = state.own.has(c.id), fav = state.fav.has(c.id), star = state.star.has(c.id);
    const q = state.qty[c.id] || 0;
    const cinza = !own && conta.cfg.cinza;
    const num = numeroTxt(c);
    const rotulo = `${c.n}, ${t("number")} ${num}, ${setNome(c)}, ${own ? t("inColl") : t("notInColl")}`;
    const src = imgPequena(c);
    const aberto = state.qtyOpen === c.id;
    return `<li class="cell" data-id="${esc(c.id)}">
      <div class="pocket-wrap">
        <button type="button" class="pocket" data-act="zoom" aria-label="${esc(t("enlarge"))}: ${esc(rotulo)}">
          ${src ? `<img class="${cinza ? "ghost" : ""}" src="${esc(src)}" alt="" width="245" height="342" loading="lazy" decoding="async" referrerpolicy="no-referrer">` : fallbackHTML(c)}
        </button>
        <button type="button" class="qty-btn${q ? " on" : ""}" data-act="qty" aria-expanded="${aberto}" aria-label="${esc(t("qtyBtn", c.n, q))}">${ICON.stack}<span>${q}</span></button>
        ${aberto ? qtyPopHTML(c) : ""}
      </div>
      <div class="cap" title="${esc(c.n)} #${esc(num)}">
        <span class="l1"><span class="no">#${esc(num)}</span><span class="nm">${esc(c.n)}</span></span>
        <span class="st">${esc(setNome(c))}</span>
      </div>
      <div class="ctrl">
        <button type="button" class="btn-fav" data-act="fav" aria-pressed="${fav}" aria-label="${esc(t("wishLabel"))}: ${esc(c.n)}, ${t("number")} ${esc(num)}, ${esc(setNome(c))}">${ICON.heart}</button>
        <button type="button" class="btn-star" data-act="star" aria-pressed="${star}" aria-label="${esc(t("starLabel"))}: ${esc(c.n)}, ${t("number")} ${esc(num)}, ${esc(setNome(c))}">${ICON.star}</button>
        <button type="button" class="btn-own" data-act="own" aria-pressed="${own}" aria-label="${esc(t("haveLabel"))}: ${esc(c.n)}, ${t("number")} ${esc(num)}, ${esc(setNome(c))}">${own ? ICON.check : ICON.plus}<span class="lbl">${own ? t("btnOwned") : t("btnHave")}</span></button>
      </div>
      ${flagsHTML(c)}
    </li>`;
  }
  const fallbackHTML = c => `<div class="fallback"><span>${esc(c.n)}</span><small>#${esc(numeroTxt(c))} · ${esc(setNome(c))}</small></div>`;
  const vagaHTML = () => `<li class="cell empty" aria-hidden="true"><div class="pocket-wrap"><div class="pocket"></div></div><div class="cap"><span class="l1">&nbsp;</span><span class="st">&nbsp;</span></div><div class="ctrl"><button type="button" tabindex="-1"></button></div><div class="flags"><button type="button" tabindex="-1"></button></div></li>`;

  function mensagemVazia() {
    const semFiltro = !state.q.trim() && !state.set && !state.serie;
    if (semFiltro && state.posse === "faltam" && state.tab === "todas") return t("allOwned");
    if (semFiltro && !state.posse) {
      if (state.tab === "colecao") return t("emptyOwned");
      if (state.tab === "favoritas") return t("emptyFav");
      if (state.tab === "estrelas") return t("emptyStar");
    }
    return t("none");
  }

  function statusHTML() {
    return state.status === "loading"
      ? `<span class="spin" aria-hidden="true"></span><span>${esc(t("loading"))}${state.progresso ? ` (${esc(state.progresso)})` : ""}</span>`
      : `<span>${esc(t("loadErr"))}</span>${state.erro ? `<small class="erro-tec">${esc(t("techDetail"))}: ${esc(state.erro)}</small>` : ""}<button type="button" class="btn-retry" data-retry="1">${esc(t("retry"))}</button>`;
  }
  function render() {
    const carregado = state.status === "ok";
    const lista = carregado ? filtradas() : [];
    state.lista = lista;
    const paginas = Math.max(1, Math.ceil(lista.length / porPagina));
    state.page = Math.min(state.page, paginas - 1);

    if (!carregado) {
      grid.hidden = true; vazio.hidden = false;
      vazio.setAttribute("aria-busy", String(state.status === "loading"));
      vazio.innerHTML = statusHTML();
    } else if (!lista.length) {
      grid.hidden = true; vazio.hidden = false; vazio.removeAttribute("aria-busy"); vazio.textContent = mensagemVazia();
    } else {
      vazio.hidden = true; grid.hidden = false;
      const fatia = lista.slice(state.page * porPagina, state.page * porPagina + porPagina);
      let html = fatia.map(cartaHTML).join("");
      for (let i = fatia.length; i < porPagina; i++) html += vagaHTML();
      grid.innerHTML = html;
    }

    pgIn.value = state.page + 1;
    pgIn.max = paginas;
    pgIn.disabled = !carregado;
    $("pgDe").textContent = t("of", paginas);
    prev.disabled = !carregado || state.page === 0;
    next.disabled = !carregado || state.page >= paginas - 1;

    const total = CARTAS.length;
    let tem = 0, copias = 0;
    CARTAS.forEach(c => { if (state.own.has(c.id)) { tem++; copias += state.qty[c.id] || 0; } });
    $("statsLine").innerHTML = t("stats", tem, total.toLocaleString());
    const pct = total ? tem / total * 100 : 0;
    $("barFill").style.width = pct + "%";
    $("bar").setAttribute("aria-valuenow", Math.round(pct));
    let extra = t("copiesTotal", copias);
    if (carregado && state.set && SETS[state.set]) {
      const s = SETS[state.set];
      const noSet = CARTAS.reduce((n, c) => n + (c.set === s.id && state.own.has(c.id) ? 1 : 0), 0);
      extra = `${s.name}: ${noSet}/${s.total} · ` + extra;
    }
    $("porColecao").textContent = extra;
    $("cTodas").textContent = total.toLocaleString();
    $("cColecao").textContent = tem;
    $("cFavoritas").textContent = CARTAS.length ? CARTAS.reduce((n, c) => n + (state.fav.has(c.id) ? 1 : 0), 0) : state.fav.size;
    $("cEstrelas").textContent = CARTAS.length ? CARTAS.reduce((n, c) => n + (state.star.has(c.id) ? 1 : 0), 0) : state.star.size;
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tab === state.tab)));
  }

  function virarPagina(dir) {
    grid.style.setProperty("--dx", (dir * 14) + "px");
    grid.classList.remove("flip");
    void grid.offsetWidth;
    grid.classList.add("flip");
  }

  // Se a imagem não carregar: tenta a da galeria oficial e, se não der, mostra nome e número
  grid.addEventListener("error", e => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement)) return;
    const cell = img.closest(".cell");
    const c = POR_ID.get(cell.dataset.id);
    if (!c) return;
    if (c.fb && img.dataset.fb !== "1" && img.src !== c.fb) { img.dataset.fb = "1"; img.src = c.fb; return; }
    const div = document.createElement("div");
    div.innerHTML = fallbackHTML(c);
    img.replaceWith(div.firstElementChild);
  }, true);

  /* ---------- Quantidade, posse e idiomas ---------- */
  function setQty(id, n) {
    n = Math.max(0, Math.min(999, n));
    if (n === 0) { delete state.qty[id]; delete state.langs[id]; state.own.delete(id); return; }
    if (!state.qty[id] && !(state.langs[id] || []).length) state.langs[id] = [conta.cfg.lang];
    state.qty[id] = n;
    state.own.add(id);
  }
  function toggleOwn(id) { setQty(id, state.own.has(id) ? 0 : 1); }
  function toggleLang(id, l) {
    const a = (state.langs[id] || []).slice();
    const i = a.indexOf(l);
    if (i >= 0) a.splice(i, 1); else a.push(l);
    if (!a.length) { setQty(id, 0); return; }
    state.langs[id] = LANGS.filter(x => a.includes(x));
    if (!state.qty[id]) state.qty[id] = 1;
    state.own.add(id);
  }

  function focarNaCelula(id, seletor) {
    const alvo = grid.querySelector(`.cell[data-id="${CSS.escape(id)}"] ${seletor}`);
    if (alvo) { alvo.focus({ preventScroll: true }); return alvo; }
    (grid.hidden ? vazio : grid).focus({ preventScroll: true });
    return null;
  }

  grid.addEventListener("click", e => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    const id = b.closest(".cell").dataset.id;
    const act = b.dataset.act;
    if (act === "zoom") { state.qtyOpen = null; abrirZoom(id); return; }
    if (act === "qty") {
      state.qtyOpen = state.qtyOpen === id ? null : id;
      render();
      focarNaCelula(id, state.qtyOpen ? '[data-act="inc"]' : '[data-act="qty"]');
      return;
    }
    const lg = b.dataset.l;
    if (act === "fav") { if (state.fav.has(id)) state.fav.delete(id); else state.fav.add(id); }
    else if (act === "star") { if (state.star.has(id)) state.star.delete(id); else state.star.add(id); }
    else if (act === "flag") toggleLang(id, lg);
    else if (act === "inc") setQty(id, (state.qty[id] || 0) + 1);
    else if (act === "dec") setQty(id, (state.qty[id] || 0) - 1);
    else toggleOwn(id);
    salvar();
    render();
    let sel = `[data-act="${act}"]`;
    if (act === "flag") sel = `[data-l="${lg}"]`;
    if (act === "dec" && !state.qty[id]) sel = '[data-act="inc"]';
    const novo = focarNaCelula(id, sel);
    if (novo && (act === "fav" || act === "star" || act === "own")) novo.classList.add("pop");
  });
  function fecharQty(focar) {
    if (!state.qtyOpen) return;
    const id = state.qtyOpen;
    state.qtyOpen = null;
    render();
    if (focar) focarNaCelula(id, '[data-act="qty"]');
  }
  document.addEventListener("click", e => {
    if (state.qtyOpen && !e.target.closest(".pocket-wrap")) fecharQty(false);
  });
  vazio.addEventListener("click", e => { if (e.target.closest("[data-retry]")) carregarDados(); });
  $("dVazio").addEventListener("click", e => { if (e.target.closest("[data-retry]")) carregarDados(); });

  document.querySelector(".tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-tab]");
    if (!b) return;
    state.tab = b.dataset.tab; state.page = 0; state.qtyOpen = null; render();
  });
  let buscaTimer;
  $("busca").addEventListener("input", e => {
    clearTimeout(buscaTimer);
    buscaTimer = setTimeout(() => { state.q = e.target.value; state.page = 0; state.qtyOpen = null; render(); }, 120);
  });
  $("fPosse").addEventListener("change", e => { state.posse = e.target.value; state.page = 0; render(); });
  $("fSerie").addEventListener("change", e => {
    state.serie = e.target.value;
    if (state.set && SETS[state.set] && state.serie && SETS[state.set].serie !== state.serie) state.set = "";
    state.page = 0; preencherFiltros(); render();
  });
  $("fSet").addEventListener("change", e => { state.set = e.target.value; state.page = 0; render(); });

  prev.addEventListener("click", () => {
    if (state.page > 0) { state.page--; state.qtyOpen = null; render(); virarPagina(-1); if (prev.disabled) next.focus(); }
  });
  next.addEventListener("click", () => {
    state.page++; state.qtyOpen = null; render(); virarPagina(1); if (next.disabled) prev.focus();
  });
  pgIn.addEventListener("change", () => {
    const max = Number(pgIn.max) || 1;
    const v = Math.min(max, Math.max(1, parseInt(pgIn.value, 10) || 1));
    state.page = v - 1; state.qtyOpen = null; render(); virarPagina(1);
  });
  pgIn.addEventListener("keydown", e => { if (e.key === "Enter") pgIn.blur(); });

  function mudouLargura() {
    const novo = calcPorPagina();
    if (novo === porPagina) return;
    state.page = Math.floor(state.page * porPagina / novo);
    dState.page = Math.floor(dState.page * porPagina / novo);
    porPagina = novo;
    atualizar();
  }
  mqLarga.addEventListener("change", mudouLargura);
  mqEstreita.addEventListener("change", mudouLargura);

  // Limpar em dois toques, sem janela de confirmação
  const reset = $("reset");
  let armado = false, timer;
  reset.addEventListener("click", () => {
    if (!armado) {
      armado = true;
      reset.textContent = t("resetArm");
      timer = setTimeout(() => { armado = false; reset.textContent = t("reset"); }, 3500);
    } else {
      clearTimeout(timer); armado = false;
      reset.textContent = t("reset");
      state.own.clear(); state.fav.clear(); state.star.clear(); state.langs = {}; state.qty = {}; state.qtyOpen = null; salvar(); render();
    }
  });

  /* ---------- Carta ampliada ---------- */
  const zoom = $("zoom");
  const zState = { ids: [], i: 0, origem: null };

  function desenharZoom() {
    const c = POR_ID.get(zState.ids[zState.i]);
    const own = state.own.has(c.id), fav = state.fav.has(c.id);
    const q = state.qty[c.id] || 0;
    const num = numeroTxt(c);
    const box = $("zImg");
    box.innerHTML = "";
    const src = imgGrande(c);
    if (src) {
      const img = new Image();
      img.referrerPolicy = "no-referrer";
      img.alt = `${c.n}, ${t("number")} ${num}, ${setNome(c)}`;
      img.addEventListener("error", () => {
        if (c.fb && img.dataset.fb !== "1" && img.src !== c.fb) { img.dataset.fb = "1"; img.src = c.fb; return; }
        box.innerHTML = fallbackHTML(c);
      });
      img.src = src;
      box.appendChild(img);
    } else box.innerHTML = fallbackHTML(c);
    $("zNome").textContent = `${c.n} #${num}`;
    $("zDet").textContent = `${setNome(c)} · ${SETS[c.set] ? SETS[c.set].serieName : ""}`;
    $("zPos").textContent = t("zPos", zState.i + 1, zState.ids.length);
    const f = $("zFav"), o = $("zOwn");
    f.setAttribute("aria-pressed", String(fav));
    f.setAttribute("aria-label", t("wishLabel") + ": " + c.n);
    f.innerHTML = ICON.heart;
    const sb = $("zStar");
    sb.setAttribute("aria-pressed", String(state.star.has(c.id)));
    sb.setAttribute("aria-label", t("starLabel") + ": " + c.n);
    sb.innerHTML = ICON.star;
    o.setAttribute("aria-pressed", String(own));
    o.setAttribute("aria-label", t("haveLabel") + ": " + c.n);
    o.innerHTML = (own ? ICON.check : ICON.plus) + `<span>${own ? t("btnOwned") : t("btnHave")}</span>`;
    $("zQtyLbl").textContent = t("copies");
    $("zQtyVal").textContent = q;
    $("zDec").disabled = q === 0;
    $("zDec").setAttribute("aria-label", t("qtyDec", c.n));
    $("zInc").setAttribute("aria-label", t("qtyInc", c.n));
    $("zFlags").setAttribute("aria-label", t("ownedIn"));
    $("zFlags").innerHTML = flagsHTML(c, true);
    $("zPrev").disabled = zState.i === 0;
    $("zNext").disabled = zState.i >= zState.ids.length - 1;
  }
  function abrirZoom(id, lista) {
    const ids = lista || state.lista.map(c => c.id);
    const i = ids.indexOf(id);
    if (i < 0) return;
    zState.ids = ids; zState.i = i;
    zState.origem = id;
    desenharZoom();
    zoom.hidden = false;
    wrap.inert = true;
    $("zClose").focus();
  }
  function fecharZoom() {
    if (zoom.hidden) return;
    zoom.hidden = true;
    wrap.inert = false;
    const atual = zState.ids[zState.i];
    const deck = conta.cfg.area === "decks";
    const lista = deck ? dState.lista : state.lista, st = deck ? dState : state, g = deck ? dGrid : grid;
    // leva o fichário até a página da carta que estava aberta
    const pos = lista.findIndex(c => c.id === atual);
    if (pos >= 0 && Math.floor(pos / porPagina) !== st.page) { st.page = Math.floor(pos / porPagina); atualizar(); }
    const alvo = g.querySelector(`.cell[data-id="${CSS.escape(atual)}"] [data-act="zoom"]`) || sideTab;
    alvo.focus({ preventScroll: false });
  }
  function irZoom(d) {
    const n = zState.i + d;
    if (n < 0 || n >= zState.ids.length) return;
    zState.i = n;
    desenharZoom();
  }
  function depoisZoom(foco) { salvar(); atualizar(); desenharZoom(); if (foco) { const b = typeof foco === "string" ? $(foco) : foco(); if (b) b.focus(); } }
  $("zClose").addEventListener("click", fecharZoom);
  $("zPrev").addEventListener("click", () => irZoom(-1));
  $("zNext").addEventListener("click", () => irZoom(1));
  $("zFav").addEventListener("click", () => { const id = zState.ids[zState.i]; if (state.fav.has(id)) state.fav.delete(id); else state.fav.add(id); depoisZoom(); });
  $("zStar").addEventListener("click", () => { const id = zState.ids[zState.i]; if (state.star.has(id)) state.star.delete(id); else state.star.add(id); depoisZoom(); });
  $("zOwn").addEventListener("click", () => { toggleOwn(zState.ids[zState.i]); depoisZoom(); });
  $("zInc").addEventListener("click", () => { const id = zState.ids[zState.i]; setQty(id, (state.qty[id] || 0) + 1); depoisZoom("zInc"); });
  $("zDec").addEventListener("click", () => { const id = zState.ids[zState.i]; setQty(id, (state.qty[id] || 0) - 1); depoisZoom(state.qty[id] ? "zDec" : "zInc"); });
  $("zFlags").addEventListener("click", e => {
    const b = e.target.closest("[data-l]");
    if (!b) return;
    const l = b.dataset.l;
    toggleLang(zState.ids[zState.i], l);
    depoisZoom(() => $("zFlags").querySelector(`[data-l="${l}"]`));
  });
  zoom.addEventListener("click", e => { if (e.target === zoom) fecharZoom(); });
  document.addEventListener("keydown", e => {
    if (!zoom.hidden) {
      if (e.key === "Escape") { e.preventDefault(); fecharZoom(); }
      else if (e.key === "ArrowLeft") irZoom(-1);
      else if (e.key === "ArrowRight") irZoom(1);
      return;
    }
    if (e.key === "Escape" && state.qtyOpen && conta.cfg.area !== "decks") { e.preventDefault(); fecharQty(true); }
  });
  let toqueX = null;
  $("zStage").addEventListener("touchstart", e => { toqueX = e.touches[0].clientX; }, { passive: true });
  $("zStage").addEventListener("touchend", e => {
    if (toqueX === null) return;
    const dx = e.changedTouches[0].clientX - toqueX;
    toqueX = null;
    if (Math.abs(dx) > 50) irZoom(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* ---------- Áreas: Binder e Deck Builder ---------- */
  function atualizar() { if (conta.cfg.area === "decks") renderDeck(); else if (conta.cfg.area === "dex") { renderDex(); carregarDex(); } else render(); }
  function aplicarArea() {
    const a = conta.cfg.area;
    $("areaBinder").hidden = a !== "binder";
    $("areaDecks").hidden = a !== "decks";
    $("areaDex").hidden = a !== "dex";
    $("statsBinder").hidden = a !== "binder";
    $("statsDeck").hidden = a !== "decks";
    $("statsDex").hidden = a !== "dex";
    $("reset").hidden = a !== "binder";
    $("lead").textContent = t(a === "decks" ? "leadDeck" : a === "dex" ? "leadDex" : "lead");
    document.querySelectorAll(".areas [data-area]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.area === conta.cfg.area)));
  }
  document.querySelector(".areas").addEventListener("click", e => {
    const b = e.target.closest("[data-area]");
    if (!b || b.dataset.area === conta.cfg.area) return;
    conta.cfg.area = b.dataset.area;
    state.qtyOpen = null;
    salvarConta();
    aplicarArea();
    atualizar();
  });

  /* ---------- Decks (salvos no navegador) ---------- */
  const KEY_DECKS = "fichario-pokemon-decks-v1";
  const DECK_MAX = 60;
  function carregarDecks() {
    try {
      const o = JSON.parse(localStorage.getItem(KEY_DECKS) || "null");
      if (o && Array.isArray(o.decks)) {
        const decks = o.decks.filter(d => d && d.id).map(d => {
          const cards = {};
          Object.entries(d.cards || {}).forEach(([id, n]) => { n = parseInt(n, 10); if (n > 0) cards[id] = Math.min(99, n); });
          return { id: String(d.id), name: String(d.name || "Deck").slice(0, 40), cards };
        });
        return { decks, atual: o.atual };
      }
    } catch (e) { /* começa sem decks */ }
    return { decks: [], atual: null };
  }
  const dk = carregarDecks();
  function salvarDecks() { try { localStorage.setItem(KEY_DECKS, JSON.stringify(dk)); } catch (e) { /* segue sem salvar */ } }
  const deckAtual = () => dk.decks.find(d => d.id === dk.atual) || dk.decks[0] || null;
  const totalDeck = d => Object.values(d.cards).reduce((a, b) => a + b, 0);
  const ENERGIA_BASICA = /^(basic )?(grass|fire|water|lightning|psychic|fighting|darkness|metal|fairy) energy$/i;

  const dState = { tab: "deck", q: "", posse: "", serie: "", set: "", page: 0, lista: [], form: null };
  const dGrid = $("dGrid"), dVazio = $("dVazio"), dPrev = $("dPrev"), dNext = $("dNext"), dPgIn = $("dPgIn");

  function dFiltradas(d) {
    const tks = norm(dState.q.trim()).split(/\s+/).filter(Boolean);
    const emDeck = dState.tab === "deck";
    const base = emDeck ? CARTAS.filter(c => d.cards[c.id]) : CARTAS;
    const lista = base.filter(c => {
      const need = d.cards[c.id] || 0, have = state.qty[c.id] || 0;
      if (dState.posse === "tenho" && (emDeck ? have < need : have === 0)) return false;
      if (dState.posse === "faltam" && (emDeck ? have >= need : have > 0)) return false;
      if (dState.serie && SETS[c.set].serie !== dState.serie) return false;
      if (dState.set && c.set !== dState.set) return false;
      if (tks.length && !casaBusca(c, tks)) return false;
      return true;
    });
    return conta.cfg.ordem === "nome" ? lista.sort(ORDENS.nome) : lista;
  }

  const ICON_LIXO = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function deckCartaHTML(c, d) {
    const need = d.cards[c.id] || 0, have = state.qty[c.id] || 0;
    const num = numeroTxt(c);
    const src = imgPequena(c);
    const emDeck = dState.tab === "deck";
    const falta = Math.max(0, need - have);
    const cinza = conta.cfg.cinza && (emDeck ? falta > 0 : have === 0);
    const rotulo = `${c.n}, ${t("number")} ${num}, ${setNome(c)}`;
    const topo = `<div class="pocket-wrap">
        <button type="button" class="pocket" data-act="zoom" aria-label="${esc(t("enlarge"))}: ${esc(rotulo)}">
          ${src ? `<img class="${cinza ? "ghost" : ""}" src="${esc(src)}" alt="" width="245" height="342" loading="lazy" decoding="async" referrerpolicy="no-referrer">` : fallbackHTML(c)}
        </button>
        ${need ? `<span class="deck-badge" aria-hidden="true">×${need}</span>` : ""}
      </div>
      <div class="cap" title="${esc(c.n)} #${esc(num)}">
        <span class="l1"><span class="no">#${esc(num)}</span><span class="nm">${esc(c.n)}</span></span>
        <span class="st">${esc(setNome(c))}</span>
      </div>`;
    if (!emDeck) {
      return `<li class="cell" data-id="${esc(c.id)}">${topo}
        <div class="ctrl">
          <button type="button" class="btn-step" data-act="dmenos" aria-label="${esc(t("dMenos", c.n))}" ${need ? "" : "disabled"}>${ICON.minus}</button>
          <button type="button" class="btn-add${need ? " on" : ""}" data-act="dmais" aria-label="${esc(t("dMais", c.n))}${need ? ` (${need})` : ""}">${ICON.plus}<span class="lbl">${esc(t("addBtn"))}</span>${need ? `<span class="n">${need}</span>` : ""}</button>
        </div>
        <p class="dinfo">${esc(t("ownedN", have))}</p>
      </li>`;
    }
    return `<li class="cell" data-id="${esc(c.id)}">${topo}
      <div class="dctl" role="group" aria-label="${esc(t("deckGroup", c.n))}">
        <span class="dlbl">${esc(t("inDeck"))}</span>
        <button type="button" data-act="dmenos" aria-label="${esc(need === 1 ? t("dTirar", c.n) : t("dMenos", c.n))}">${need === 1 ? ICON_LIXO : ICON.minus}</button>
        <output>${need}</output>
        <button type="button" data-act="dmais" aria-label="${esc(t("dMais", c.n))}">${ICON.plus}</button>
      </div>
      <div class="dctl own ${falta ? "miss" : "ok"}" role="group" aria-label="${esc(t("ownGroup", c.n))}">
        <span class="dlbl">${esc(t("ownedLbl"))}</span>
        <button type="button" data-act="omenos" aria-label="${esc(t("oMenos", c.n))}" ${have ? "" : "disabled"}>${ICON.minus}</button>
        <output>${have}</output>
        <button type="button" data-act="omais" aria-label="${esc(t("oMais", c.n))}">${ICON.plus}</button>
      </div>
      <p class="dstatus ${falta ? "miss" : "ok"}">${falta ? esc(t("missingN", falta)) : ICON.check + esc(t("complete"))}</p>
    </li>`;
  }
  const deckVagaHTML = () => `<li class="cell empty" aria-hidden="true"><div class="pocket-wrap"><div class="pocket"></div></div><div class="cap"><span class="l1">&nbsp;</span><span class="st">&nbsp;</span></div><div class="ctrl"><button type="button" tabindex="-1"></button></div></li>`;

  function renderDeck() {
    const d = deckAtual();
    if (d) dk.atual = d.id;
    // seletor de decks
    $("deckSel").innerHTML = dk.decks.map(x => `<option value="${esc(x.id)}">${esc(x.name)} (${totalDeck(x)})</option>`).join("");
    if (d) $("deckSel").value = d.id;
    $("deckSel").disabled = !d;
    $("deckRen").disabled = !d;
    $("deckDel").disabled = !d;
    $("deckForm").hidden = !dState.form;
    $("deckSemDeck").hidden = !!d || !!dState.form;
    $("deckCorpo").hidden = !d;
    document.querySelectorAll("[data-dtab]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.dtab === dState.tab)));

    if (!d) {
      $("deckLine").innerHTML = t("deckNoneLine");
      $("dBarFill").style.width = "0%"; $("dBar").setAttribute("aria-valuenow", 0);
      $("deckSub").textContent = "";

    // números do deck
    const total = totalDeck(d);
    let cobertas = 0;
    const porNome = {};
    Object.entries(d.cards).forEach(([id, n]) => {
      cobertas += Math.min(n, state.qty[id] || 0);
      const c = POR_ID.get(id);
      const nome = c ? c.n : id;
      porNome[nome] = (porNome[nome] || 0) + n;
    });
    $("deckLine").innerHTML = t("deckLine", total, DECK_MAX, esc(d.name));
    const pct = total ? cobertas / total * 100 : 0;
    $("dBarFill").style.width = pct + "%";
    $("dBar").setAttribute("aria-valuenow", Math.round(pct));
    $("deckSub").textContent = t("deckSub", cobertas, total);
    $("dCount").textContent = total;
    const avisos = [];
    if (total < DECK_MAX) avisos.push(t("deckNeed", DECK_MAX - total));
    else if (total > DECK_MAX) avisos.push(t("deckOver", total));
    else avisos.push(t("deckOk"));
    const demais = Object.entries(porNome).filter(([nome, n]) => n > 4 && !ENERGIA_BASICA.test(nome)).map(([nome]) => nome);
    if (demais.length) avisos.push(t("deckFour", demais.join(", ")));
    $("deckAviso").textContent = avisos.join(" ");
    $("deckAviso").classList.toggle("ok", total === DECK_MAX && !demais.length);

    // grade
    const carregado = state.status === "ok";
    const lista = carregado ? dFiltradas(d) : [];
    dState.lista = lista;
    const paginas = Math.max(1, Math.ceil(lista.length / porPagina));
    dState.page = Math.min(dState.page, paginas - 1);
    if (!carregado) {
      dGrid.hidden = true; dVazio.hidden = false;

      dGrid.hidden = true; dVazio.hidden = false;

      dVazio.textContent = dState.tab === "deck" && semFiltro ? t("deckEmpty") : t("none");
    } else {
      dVazio.hidden = true; dGrid.hidden = false;

      let html = fatia.map(c => deckCartaHTML(c, d)).join("");

    dPgIn.value = dState.page + 1;
    dPgIn.max = paginas;
    dPgIn.disabled = !carregado;

    dPrev.disabled = !carregado || dState.page === 0;
    dNext.disabled = !carregado || dState.page >= paginas - 1;
  }

  function mudarDeck(id, delta) {
    const d = deckAtual();
    if (!d) return;
    const n = Math.max(0, Math.min(99, (d.cards[id] || 0) + delta));
    if (n) d.cards[id] = n; else delete d.cards[id];
    salvarDecks();
  }
  function focarDeck(id, sel) {
    const alvo = dGrid.querySelector(`.cell[data-id="${CSS.escape(id)}"] ${sel}`);
    if (alvo && !alvo.disabled) { alvo.focus({ preventScroll: true }); return; }
    const alt = dGrid.querySelector(`.cell[data-id="${CSS.escape(id)}"] [data-act="dmais"]`);
    if (alt) alt.focus({ preventScroll: true }); else (dGrid.hidden ? dVazio : dGrid).focus({ preventScroll: true });
  }
  dGrid.addEventListener("error", e => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement)) return;

    if (c.fb && img.dataset.fb !== "1" && img.src !== c.fb) { img.dataset.fb = "1"; img.src = c.fb; return; }
    const div = document.createElement("div");
    div.innerHTML = fallbackHTML(c);

  /* ---------- Pokédex (dados da PokéAPI, pokeapi.co) ---------- */

  const COR_TIPO = { normal: "#A8A77A", fire: "#EE8130", water: "#6390F0", grass: "#7AC74C", electric: "#F7D02C", ice: "#96D9D6", fighting: "#C22E28", poison: "#A33EA1", ground: "#E2BF65", flying: "#A98FF3", psychic: "#F95587", bug: "#A6B91A", rock: "#B6A136", ghost: "#735797", dragon: "#6F35FC", dark: "#705746", steel: "#B7B7CE", fairy: "#D685AD" };
  const TINTA_TIPO = { normal: "#1A1A1A", fire: "#1A1A1A", water: "#1A1A1A", grass: "#1A1A1A", electric: "#1A1A1A", ice: "#1A1A1A", fighting: "#FFFFFF", poison: "#FFFFFF", ground: "#1A1A1A", flying: "#1A1A1A", psychic: "#1A1A1A", bug: "#1A1A1A", rock: "#1A1A1A", ghost: "#FFFFFF", dragon: "#FFFFFF", dark: "#FFFFFF", steel: "#1A1A1A", fairy: "#1A1A1A" };
  const NOMES_ESPECIAIS = {
    "nidoran-f": "Nidoran♀", "nidoran-m": "Nidoran♂", "mr-mime": "Mr. Mime", "mime-jr": "Mime Jr.", "mr-rime": "Mr. Rime",

  const nomeBonito = slug => NOMES_ESPECIAIS[slug] || slug.split("-").map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(" ");

  const pad4 = n => String(n).padStart(4, "0");

  let DEX = [];
  const dexState = { q: "", gen: "", tipo: "", page: 0, lista: [], status: "idle", erro: "", tipoCarregando: false };
  const TIPO_DADOS = {}; // nome -> { ids: Set, rel: damage_relations }
  const DETALHES = new Map();
  const xGrid = $("xGrid"), xVazio = $("xVazio"), xPrev = $("xPrev"), xNext = $("xNext"), xPgIn = $("xPgIn");
  const mqDexLarga = window.matchMedia("(min-width: 860px)"), mqDexEstreita = window.matchMedia("(max-width: 479px)");
  const dexPorPagina = () => mqDexLarga.matches ? 24 : mqDexEstreita.matches ? 12 : 16;

  async function papi(path) {
    return getJSON(path.startsWith("http") ? path : PAPI + path);
  }
  async function carregarDex() {
    if (dexState.status === "ok" || dexState.status === "loading") return;
    dexState.status = "loading"; dexState.erro = "";
    renderDex();
    try {
      let lista = null;
      try {
        const db = await abrirDB();
        const c = await new Promise(ok => { const r = db.transaction("dados").objectStore("dados").get("dex-list-v1"); r.onsuccess = () => ok(r.result || null); r.onerror = () => ok(null); });
        if (c && Date.now() - c.quando < 7 * 24 * 3600e3) lista = c.lista;
      } catch (e) { /* sem cache */ }
      if (!lista) {
        const r = await papi("/pokemon-species?limit=2000");
        lista = (r.results || []).map(x => ({ id: idDaUrl(x.url), slug: x.name })).filter(x => x.id);
        try { const db = await abrirDB(); db.transaction("dados", "readwrite").objectStore("dados").put({ quando: Date.now(), lista }, "dex-list-v1"); } catch (e) { /* segue */ }
      }
      DEX = lista.sort((a, b) => a.id - b.id).map(x => ({ id: x.id, slug: x.slug, n: nomeBonito(x.slug), nn: norm(nomeBonito(x.slug)) }));
      dexState.status = "ok";
    } catch (e) {
      console.error(e);
      dexState.status = "error"; dexState.erro = (e && e.message) || String(e);
    }
    renderDex();
  }
  async function dadosTipo(nome) {
    if (TIPO_DADOS[nome]) return TIPO_DADOS[nome];
    const r = await papi("/type/" + nome);
    const ids = new Set((r.pokemon || []).map(p => idDaUrl(p.pokemon.url)).filter(id => id && id < 10000));
    TIPO_DADOS[nome] = { ids, rel: r.damage_relations || {} };
    return TIPO_DADOS[nome];
  }

  function dexFiltrados() {
    const tks = norm(dexState.q.trim()).replace(/#/g, "").split(/\s+/).filter(Boolean);
    const g = dexState.gen ? GERACOES[Number(dexState.gen)] : null;
    const tipoIds = dexState.tipo && TIPO_DADOS[dexState.tipo] ? TIPO_DADOS[dexState.tipo].ids : null;
    return DEX.filter(p => {
      if (g && (p.id < g[0] || p.id > g[1])) return false;
      if (tipoIds && !tipoIds.has(p.id)) return false;
      for (const tk of tks) {
        if (/^\d+$/.test(tk)) { if (p.id !== parseInt(tk, 10) && !p.nn.includes(tk)) return false; }
        else if (!p.nn.includes(tk)) return false;
      }
      return true;
    });
  }

  function renderDex() {
    $("dexLine").innerHTML = t("dexCount", DEX.length ? DEX.length.toLocaleString() : "…");
    const ok = dexState.status === "ok" && !dexState.tipoCarregando;
    const lista = ok ? dexFiltrados() : [];

      xGrid.innerHTML = fatia.map(p => `<li><button type="button" class="dex-tile" data-dex="${p.id}" aria-label="${esc(t("dexOpen", p.n, pad4(p.id)))}">
          <span class="dex-art"><img src="${ARTE(p.id)}" alt="" width="120" height="120" loading="lazy" decoding="async"></span>
          <span class="dex-no">#${pad4(p.id)}</span><span class="dex-nm">${esc(p.n)}</span>

  xGrid.addEventListener("error", e => {

  /* ---------- Ficha do Pokémon ---------- */
  const dexModal = $("dexModal");
  const xState = { ids: [], i: 0, origem: null, shiny: false, pedido: 0 };
  async function carregarDetalhe(id) {
    if (DETALHES.has(id)) return DETALHES.get(id);
    const [pk, sp] = await Promise.all([papi("/pokemon/" + id), papi("/pokemon-species/" + id)]);
    const extras = await Promise.all([
      sp.evolution_chain && sp.evolution_chain.url ? papi(sp.evolution_chain.url).catch(() => null) : null,
      Promise.all((pk.types || []).map(x => dadosTipo(x.type.name).catch(() => null))),
      Promise.all((pk.abilities || []).map(a => papi(a.ability.url).catch(() => null)))
    ]);
    const d = { pk, sp, evo: extras[0], tipos: extras[1], habs: extras[2] };
    DETALHES.set(id, d);
    return d;
  }
  const emIngles = arr => (arr || []).filter(x => x.language && x.language.name === "en");
  function condicaoEvo(det) {
    if (!det) return "";
    if (det.min_level) return t("evoLv", det.min_level);
    if (det.item) return t("evoItem", textoBonito(det.item.name));
    if (det.trigger && det.trigger.name === "trade") return det.held_item ? t("evoTradeItem", textoBonito(det.held_item.name)) : t("evoTrade");
    if (det.min_happiness || det.min_affection) return t("evoFriend");
    if (det.known_move) return t("evoMove", textoBonito(det.known_move.name));
    if (det.trigger) return textoBonito(det.trigger.name);
    return "";
  }
  function evoHTML(evo, atual) {
    if (!evo || !evo.chain) return "";
    const etapa = (no, det) => {
      const id = idDaUrl(no.species.url);
      const nome = nomeBonito(no.species.name);
      const cond = condicaoEvo(det);
      return `<button type="button" class="evo-etapa${id === atual ? " atual" : ""}" data-evo="${id}" ${id === atual ? 'aria-current="true"' : ""}>
          <img src="${ARTE(id)}" alt="" width="72" height="72" loading="lazy">
          <span class="evo-nm">${esc(nome)}</span><span class="evo-no">#${pad4(id)}</span>
          ${cond ? `<span class="evo-cond">${esc(cond)}</span>` : ""}
        </button>`;
    };
    const ramo = (no, det) => {
      let h = etapa(no, det);
      if (no.evolves_to && no.evolves_to.length) {
        h += `<span class="evo-seta" aria-hidden="true">→</span><div class="evo-filhos">` +
          no.evolves_to.map(f => `<div class="evo-ramo">${ramo(f, (f.evolution_details || [])[0])}</div>`).join("") + `</div>`;
      }
